<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lernpfade Mathematik</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: Kurs-Pinnwand auf Karopapier; Filterleiste oben, Taskcards im Raster, je Fach eine Kantenfarbe */
:root{
  --paper:#f6f7f9; --grid:#e3e7ee; --ink:#1d2a3a; --muted:#566476; --card:#ffffff; --line:#d3d9e2;
  --accent:#b87700; --accent-soft:#fbefd2;
  --mathe:#2f6db5; --physik:#b3402a; --info:#2e7d4f; --sonst:#7a5aa8;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#141a22; --grid:#1d2530; --ink:#e6ebf2; --muted:#9aa7b8; --card:#1b232e; --line:#2e3a49;
  --accent:#f2b134; --accent-soft:#3a2e14; --mathe:#6fa6e8; --physik:#ef7a62; --info:#5fc18a; --sonst:#b49ae0; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141a22; --grid:#1d2530; --ink:#e6ebf2; --muted:#9aa7b8; --card:#1b232e; --line:#2e3a49;
  --accent:#f2b134; --accent-soft:#3a2e14; --mathe:#6fa6e8; --physik:#ef7a62; --info:#5fc18a; --sonst:#b49ae0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:17px/1.55 var(--f-body);margin:0;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
.wrap{max-width:1080px;margin:0 auto}
header{padding-block:44px 20px;display:grid;gap:12px}
.eyebrow{font:600 .78rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font:700 clamp(2rem,6vw,3.2rem)/1.1 var(--f-display);margin:0;text-wrap:balance}
.lead{margin:0;max-width:60ch;color:var(--muted);font-size:1.1rem}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;background:var(--paper);border-bottom:1px solid var(--line);padding-block:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 .85rem var(--f-body);cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:5px 12px;border-radius:999px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip:focus-visible,.search:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.search{margin-left:auto;font:inherit;font-size:.92rem;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);min-width:0;width:220px;max-width:100%}
.count{font:.8rem var(--f-mono);color:var(--muted);margin-top:18px}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;margin-top:10px}
.card{--c:var(--sonst);display:grid;grid-template-rows:auto 1fr auto;background:var(--card);border:1px solid var(--line);border-top:6px solid var(--c);border-radius:6px;color:inherit;text-decoration:none;min-width:0;transition:transform .15s ease,box-shadow .15s ease}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(20,30,45,.12)}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px 0}
.fach{font:600 .72rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.kurs{font:700 .8rem var(--f-display);background:var(--accent-soft);padding:2px 9px;border-radius:4px}
.card-body{padding:8px 16px 14px;display:grid;gap:8px;align-content:start}
.card h2{font:700 1.3rem/1.2 var(--f-display);margin:0;text-wrap:balance}
.card p{margin:0;color:var(--muted);font-size:.95rem}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:.78rem;border:1px solid var(--line);border-radius:3px;padding:1px 7px;color:var(--muted)}
.card-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 16px;border-top:1px dashed var(--line)}
.path{font:.8rem var(--f-mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.go{font:600 .9rem var(--f-body);color:var(--c);white-space:nowrap}
.card.example{border-style:dashed;border-top-style:solid}
.badge{font:600 .68rem var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border:1px dashed var(--muted);border-radius:3px;padding:0 6px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}
footer{margin-top:40px;font-size:.85rem;color:var(--muted)}
@media (max-width:560px){.search{margin-left:0;width:100%}}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
</style>
</head>
<body>


<div class="wrap">
<header>
  <span class="eyebrow">Unterrichtsmaterial · Selbstlernpfade</span>
  <h1>Lernpfade Mathematik</h1>
  <p class="lead">Wähle deinen Kurs und öffne den Lernpfad, an dem ihr gerade arbeitet.</p>
</header>

<div class="bar" role="toolbar" aria-label="Filter">
  <div class="chips" id="chips"></div>
  <input class="search" id="q" type="search" placeholder="Thema suchen …" aria-label="Thema suchen">
</div>

<p class="count" id="count" aria-live="polite"></p>
<main class="board" id="board"></main>

<footer>Neue Lernpfade erscheinen hier automatisch, sobald im Repository ein neuer Ordner mit einer index.html liegt.</footer>
</div>

<script>
(function(){
/* Karten-Steckbriefe: Ordnername → Angaben für die Taskcard.
   Ordner ohne Eintrag erscheinen trotzdem (Titel aus der index.html des Ordners). */
const KARTEN = {
  "Mathe": {titel:"Licht, Schatten, Spiegelbild", fach:"Mathematik", kurs:"Q2",
            text:"Schattenwurf bei Sonne und Lampe, Spiegelung an Koordinatenebenen und Prismenvolumen.",
            tags:["Analytische Geometrie","3 Stationen","GeoGebra"]},
  "Beispiel-EF": {titel:"Ableitung als Änderungsrate", fach:"Mathematik", kurs:"EF", beispiel:true,
            text:"Platzhalter: So sieht eine weitere Karte aus, sobald es den Ordner gibt.", tags:["Analysis"]},
  "Beispiel-7b": {titel:"Terme und Gleichungen", fach:"Mathematik", kurs:"7b", beispiel:true,
            text:"Platzhalter für einen Lernpfad der Sekundarstufe I.", tags:["Algebra"]}
};
const FARBE = {"Mathematik":"var(--mathe)","Physik":"var(--physik)","Informatik":"var(--info)"};
const OWNER="FrauOTB", REPO="Q2";
const onPages = /github\.io$/.test(location.hostname);
const base = onPages ? "" : "https://frauotb.github.io/Q2/";
const IGNORE = new Set([".github","assets","node_modules"]);

let cards = Object.entries(KARTEN).map(([ordner,k])=>({ordner,...k}));
let kursFilter="Alle", query="";

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function render(){
  const kurse=["Alle",...[...new Set(cards.map(c=>c.kurs).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'de',{numeric:true}))];
  const chips=document.getElementById('chips');
  chips.innerHTML=kurse.map(k=>`<button class="chip" type="button" aria-pressed="${k===kursFilter}">${esc(k)}</button>`).join('');
  chips.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{kursFilter=b.textContent;render();});
  const q=query.toLowerCase();
  const list=cards.filter(c=>(kursFilter==="Alle"||c.kurs===kursFilter)&&(!q||[c.titel,c.text,c.fach,c.kurs,...(c.tags||[])].join(' ').toLowerCase().includes(q)));
  document.getElementById('count').textContent=list.length+(list.length===1?' Lernpfad':' Lernpfade');
  document.getElementById('board').innerHTML=list.length?list.map(c=>`
    <a class="card${c.beispiel?' example':''}" href="${c.beispiel?'#':esc(base+encodeURI(c.ordner)+'/')}" style="--c:${FARBE[c.fach]||'var(--sonst)'}"${c.beispiel?' aria-disabled="true"':''}>
      <div class="card-head"><span class="fach">${esc(c.fach||'Material')}</span>${c.beispiel?'<span class="badge">Beispiel</span>':''}${c.kurs?`<span class="kurs">${esc(c.kurs)}</span>`:''}</div>
      <div class="card-body"><h2>${esc(c.titel||c.ordner)}</h2>${c.text?`<p>${esc(c.text)}</p>`:''}
        ${(c.tags||[]).length?`<div class="tags">${c.tags.map(t=>`<span>${esc(t)}</span>`).join('')}</div>`:''}</div>
      <div class="card-foot"><span class="path">/${esc(c.ordner)}</span><span class="go">Öffnen →</span></div>
    </a>`).join(''):'<p class="empty">Kein Lernpfad passt zu deiner Auswahl.</p>';
  document.querySelectorAll('.card.example').forEach(a=>a.addEventListener('click',e=>e.preventDefault()));
}
document.getElementById('q').addEventListener('input',e=>{query=e.target.value;render();});
render();

/* Auf GitHub Pages: Ordner im Repository automatisch finden (Ergebnis 1 Stunde zwischengespeichert) */
async function discover(){
  if(!onPages)return;
  let dirs=null;
  try{const c=JSON.parse(localStorage.getItem('ordner')||'null');if(c&&Date.now()-c.t<36e5)dirs=c.d;}catch(e){}
  if(!dirs){
    try{const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/`);if(!r.ok)return;
      dirs=(await r.json()).filter(x=>x.type==='dir'&&!IGNORE.has(x.name)&&!x.name.startsWith('.')).map(x=>x.name);
      try{localStorage.setItem('ordner',JSON.stringify({t:Date.now(),d:dirs}));}catch(e){}
    }catch(e){return;}
  }
  cards=cards.filter(c=>!c.beispiel);
  for(const d of dirs){
    if(cards.some(c=>c.ordner===d))continue;
    let titel=d;
    try{const h=await (await fetch(encodeURI(d)+'/')).text();const m=h.match(/<title>([^<]*)<\/title>/i);if(m)titel=m[1].trim();}catch(e){}
    cards.push({ordner:d,titel,fach:'Material',kurs:''});
  }
  render();
}
discover();
})();
</script>

</body>
</html>
