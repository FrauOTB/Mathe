<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Unterrichtsmaterial · Anmeldung</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{--paper:#f6f7f9;--grid:#e3e7ee;--ink:#1d2a3a;--muted:#566476;--card:#fff;--line:#d3d9e2;--accent:#2f6db5;--bad:#b3402a}
@media (prefers-color-scheme: dark){:root{--paper:#141a22;--grid:#1d2530;--ink:#e6ebf2;--muted:#9aa7b8;--card:#1b232e;--line:#2e3a49;--accent:#6fa6e8;--bad:#ef7a62;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--paper);color:var(--ink);
  font:17px/1.5 "Source Sans 3","Segoe UI",system-ui,sans-serif;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
form{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-top:6px solid var(--accent);border-radius:6px;padding:24px;display:grid;gap:14px}
h1{margin:0;font:700 1.6rem/1.15 "Bricolage Grotesque","Segoe UI",system-ui,sans-serif}
p{margin:0;color:var(--muted)}
label{display:grid;gap:4px;font-weight:600;font-size:.92rem}
input[type=password]{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:4px;background:var(--paper);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rem{display:flex;gap:8px;align-items:center;font-weight:400;color:var(--muted)}
button{font-weight:600;font-size:1rem;font-family:inherit;padding:10px;border:0;border-radius:4px;background:var(--accent);color:#fff;cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
.err{color:var(--bad);font-weight:600;min-height:1.5em}
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1>Unterrichtsmaterial</h1>
  <p>Diese Seite ist geschützt. Das Passwort bekommst du im Unterricht.</p>
  <input type="text" name="username" value="Unterricht" autocomplete="username" hidden>
  <label for="pw">Passwort<input id="pw" type="password" autocomplete="current-password" required autofocus></label>
  <label class="rem" for="rem"><input id="rem" type="checkbox" checked> Auf diesem Gerät merken</label>
  <button id="b" type="submit">Öffnen</button>
  <p class="err" id="e" role="alert"></p>
</form>

const K='ukey-'+P.s.slice(0,8);
const d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(raw){
  const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:d(P.i)},key,d(P.c));
  const html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
}
async function derive(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:d(P.s),iterations:P.n},base,256));
}
(async()=>{try{const s=localStorage.getItem(K);if(s)await open(d(s));}catch(e){try{localStorage.removeItem(K);}catch(_){}}})();
document.getElementById('f').addEventListener('submit',async ev=>{
  ev.preventDefault();const b=document.getElementById('b'),e=document.getElementById('e');
  b.disabled=true;b.textContent='Wird geöffnet …';e.textContent='';
  try{
    const raw=await derive(document.getElementById('pw').value);
    if(document.getElementById('rem').checked){try{localStorage.setItem(K,btoa(String.fromCharCode(...raw)));}catch(_){}}

  }catch(err){b.disabled=false;b.textContent='Öffnen';e.textContent='Das Passwort stimmt nicht. Versuche es noch einmal.';}
});
