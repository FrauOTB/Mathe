<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Gipfelweg Lineare Funktionen</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: eine Bergroute als Koordinatensystem ist die Zentrale; jede Etappe ist eine Arbeitsfläche aus Aufgabenkarte + Koordinatenebene. Akzent = rot-weiß-rote Wegmarkierung. */
:root{
  --bg:#EBF0F3; --surface:#FFFFFF; --surface-2:#E1E8ED; --ink:#13202B; --muted:#566977; --line:#C8D3DB;
  --trail:#C42739; --trail-ink:#FFFFFF; --trail-soft:#FBE4E7;
  --pine:#1B6A55; --sky:#2563A6; --violet:#6A4FB2; --gold:#A87600; --gold-soft:#FCEFC7;
  --ok:#1B7A4A; --ok-soft:#DCF1E4; --bad:#B42318; --bad-soft:#FBE3E0;
  --rock:#BCC8D1; --rock-2:#A2B1BC; --snow:#FFFFFF; --grid:#DCE4E9; --axis:#34444F; --plotbg:#FBFCFD;
  --shadow:0 1px 2px rgba(19,32,43,.06),0 10px 28px -14px rgba(19,32,43,.22);
  --f-display:'Archivo','Arial Narrow',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0C1319; --surface:#141F28; --surface-2:#1B2833; --ink:#E5EDF2; --muted:#93A5B3; --line:#2A3B48;
  --trail:#E9485C; --trail-ink:#FFFFFF; --trail-soft:#3A1419;
  --pine:#4FB892; --sky:#72AAEB; --violet:#A891F2; --gold:#F0BE45; --gold-soft:#32280E;
  --ok:#4CC488; --ok-soft:#11301F; --bad:#FF7E71; --bad-soft:#3B1714;
  --rock:#283846; --rock-2:#334656; --snow:#D6E1E9; --grid:#203039; --axis:#A9B8C3; --plotbg:#111B23;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0C1319; --surface:#141F28; --surface-2:#1B2833; --ink:#E5EDF2; --muted:#93A5B3; --line:#2A3B48;
  --trail:#E9485C; --trail-ink:#FFFFFF; --trail-soft:#3A1419;
  --pine:#4FB892; --sky:#72AAEB; --violet:#A891F2; --gold:#F0BE45; --gold-soft:#32280E;
  --ok:#4CC488; --ok-soft:#11301F; --bad:#FF7E71; --bad-soft:#3B1714;
  --rock:#283846; --rock-2:#334656; --snow:#D6E1E9; --grid:#203039; --axis:#A9B8C3; --plotbg:#111B23;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1120px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-stretch:112%;line-height:1.12;text-wrap:balance;margin:0}
h1{font-size:clamp(1.6rem,3.4vw,2.3rem);font-weight:800}
h2{font-size:1.35rem;font-weight:750}
h3{font-size:1.08rem;font-weight:700}
p{margin:0}
i{font-family:'Times New Roman',Georgia,serif;font-size:1.08em}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:6px}
.eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.lead{color:var(--muted);max-width:62ch}
.muted{color:var(--muted)}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* Wegmarkierung */
.mark{display:inline-flex;flex-direction:column;width:22px;height:22px;border-radius:4px;overflow:hidden;flex:none;box-shadow:0 0 0 1px var(--line)}
.mark span{flex:1;background:var(--trail)} .mark span:nth-child(2){background:var(--snow)}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.hud-in{display:flex;align-items:center;gap:12px;min-height:58px;padding-block:8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-stretch:125%;font-weight:850;font-size:1.05rem;letter-spacing:.01em;background:none;border:0;padding:4px}
.stats{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;align-items:center}
.stat{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--surface-2);font-family:var(--f-mono);font-size:.84rem;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat small{font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:.78rem}
.stat.hm{color:var(--sky)} .stat.fire{color:var(--trail)} .stat.gem{color:var(--violet)} .stat.key{color:var(--gold)}
.stat.combo{background:var(--trail);color:var(--trail-ink)}
.stat.off{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:10px 16px;font-weight:700;background:var(--trail);color:var(--trail-ink);min-height:42px;text-decoration:none}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1.5px var(--muted)}
.btn.soft{background:var(--surface-2);color:var(--ink)}
.btn.gold{background:var(--gold);color:#1d1400}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn.sm{padding:6px 12px;min-height:34px;font-size:.9rem}

main{padding-block:24px 64px}

/* Start */
.start{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:32px;align-items:start;padding-block:28px}
.start-title{font-family:var(--f-display);font-stretch:125%;font-weight:900;font-size:clamp(2.6rem,7vw,4.6rem);line-height:.95;letter-spacing:-.01em;margin:14px 0 10px}
.start-title span{color:var(--trail)}
.login{margin-top:22px;background:var(--surface);border-radius:14px;padding:20px;box-shadow:var(--shadow);display:grid;gap:14px}
.login .row{display:flex;gap:8px;flex-wrap:wrap}
.code-inp{font-family:var(--f-mono);font-size:1.02rem;letter-spacing:.06em;text-transform:uppercase;flex:1 1 220px;min-width:0}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.85rem}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.err{color:var(--bad);font-size:.92rem}
.howto{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}
.howto div{display:grid;gap:4px;padding-top:10px;border-top:2px solid var(--line)}
.howto b{font-family:var(--f-display);font-stretch:112%}
.howto p{font-size:.92rem;color:var(--muted)}

/* Karte */
.mapcard{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:14px 10px 6px;overflow:hidden}
.map{width:100%;height:auto;display:block}
.map .ridge{fill:var(--rock-2);opacity:.45}
.map .mount{fill:var(--rock)}
.map .snow{fill:var(--snow)}
.map .mgrid{stroke:var(--grid);stroke-width:1}
.map .maxis{stroke:var(--axis);stroke-width:1.4;fill:none}
.map text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
.map .seg{stroke:var(--line);stroke-width:7;stroke-linecap:round;fill:none}
.map .seg.done{stroke:var(--trail)}
.map .seg-w{stroke:var(--snow);stroke-width:2.4;stroke-dasharray:7 9;fill:none;stroke-linecap:round}
.map .slope{fill:var(--ink);font-weight:700;font-size:11px}
.map .st circle.base{fill:var(--surface);stroke:var(--line);stroke-width:3}
.map .st.open circle.base{stroke:var(--trail)}
.map .st.done circle.base{fill:var(--gold);stroke:var(--gold)}
.map .st .sic{fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.map .st.open .sic{stroke:var(--trail)} .map .st.done .sic{stroke:#1d1400}
.map .st.click{cursor:pointer}
.map .st.click:hover circle.base{stroke-width:5}
.map .st:focus{outline:none} .map .st:focus-visible circle.base{stroke:var(--sky);stroke-width:5}
.map .st text.num{fill:var(--ink);font-family:var(--f-display);font-weight:800;font-size:13px}
.map .here{fill:var(--sky);opacity:.25;transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{transform:scale(.7);opacity:.5}100%{transform:scale(1.6);opacity:0}}

.route-head{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.rank{display:grid;gap:6px;min-width:240px}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar > span{display:block;height:100%;background:var(--sky);border-radius:99px;transition:width .5s}
.bar.gold > span{background:var(--gold)}
.lvl-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:20px}
.lcard{background:var(--surface);border-radius:12px;padding:14px 16px;display:grid;gap:8px;text-align:left;border:1.5px solid transparent;box-shadow:var(--shadow);align-content:start}
.lcard:not([disabled]):hover{border-color:var(--trail)}
.lcard[disabled]{opacity:.62;cursor:not-allowed;box-shadow:none;background:var(--surface-2)}
.lcard .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lcard h3{font-size:1rem}
.lcard p{font-size:.88rem;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.open{background:var(--trail-soft);color:var(--trail)}
.chip.done{background:var(--gold-soft);color:var(--gold)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip .ic{width:14px;height:14px}
.save-band{margin-top:28px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}

/* Etappe */
.back{background:none;border:0;padding:6px 0;color:var(--muted);font-weight:700;margin-bottom:10px}
.back:hover{color:var(--ink)}
.lvl-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.lvl-head > div:first-child{display:grid;gap:6px;min-width:0}
.lvl-chips{display:flex;gap:6px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:22px;overflow-x:auto}
.tab{background:none;border:0;padding:10px 14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--trail)}
.tab .ic{width:16px;height:16px}

/* Aufgaben */
.task{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:20px;display:grid;gap:16px}
.task-body{display:grid;gap:18px}
.task.has-plot .task-body{grid-template-columns:minmax(0,1fr) minmax(0,380px)}
.task-q{font-size:1.06rem;min-width:0}
.task-q > div{margin-block:12px}.task-q > div:first-child{margin-top:0}
.task-tag{display:flex;gap:6px;flex-wrap:wrap}
.task form{display:grid;gap:10px}
.ans{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ans > label{font-weight:700;font-size:.92rem}
.inp{font:inherit;font-family:var(--f-mono);font-size:1rem;padding:9px 12px;border-radius:9px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);min-width:0;width:12ch}
.inp:focus{border-color:var(--sky);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--sky) 25%,transparent)}
.inp.wide{width:min(22ch,100%)}
.inp.sm{width:7ch;text-align:center}
.eqwrap{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-mono);font-weight:700}
.unit{font-weight:700;color:var(--muted)}
.fmt{font-size:.84rem;color:var(--muted)}
.choices{display:grid;gap:8px}
.choice{text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 14px}
.choice:hover{border-color:var(--muted)}
.choice[aria-checked="true"]{border-color:var(--sky);background:color-mix(in srgb,var(--sky) 12%,var(--surface));box-shadow:inset 0 0 0 1px var(--sky)}
.fb{min-height:0;font-weight:700;border-radius:10px;padding:0}
.fb.show{padding:10px 14px}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.no{background:var(--bad-soft);color:var(--bad)}
.fb.info{background:var(--surface-2);color:var(--ink);font-weight:400}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.hints{display:grid;gap:8px}
.hint{background:var(--gold-soft);border-radius:10px;padding:10px 14px;font-size:.96rem;display:grid;gap:2px}
.hint b{font-size:.74rem;font-family:var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.after{display:grid;gap:12px;border-top:1px dashed var(--line);padding-top:14px}
.after .plot{max-width:340px}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tbl-scroll{overflow-x:auto;max-width:100%}
.vt{border-collapse:collapse;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.vt th,.vt td{border:1.5px solid var(--line);padding:6px 10px;text-align:center;min-width:3.2em}
.vt th{background:var(--surface-2);font-family:'Times New Roman',Georgia,serif;font-style:italic;font-size:1.1em}
.vt td .inp{width:6ch;padding:6px;text-align:center}
.eq{font-family:var(--f-mono);font-weight:700;white-space:nowrap}
.eq i,.pt i{font-weight:700}
.pt{font-family:var(--f-mono);white-space:nowrap}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.8em;line-height:1.05;margin:0 1px}
.fr span:first-child{border-bottom:1.5px solid currentColor;padding:0 2px}
.heft{background:var(--surface-2);border-radius:10px;padding:10px 14px;font-size:.92rem;display:flex;gap:10px;align-items:flex-start}
.heft.note{background:var(--gold-soft);align-items:center;flex-wrap:wrap}
.heft.note > span{flex:1 1 260px}
.ms{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:20px;display:grid;gap:14px;border-top:5px solid var(--gold)}
.ms-ta{width:100%;min-height:104px;font-family:var(--f-body);line-height:1.5;resize:vertical}
.ms .types .chip{font-weight:600}
.ms-frage{font-weight:700}
.formel{border:2px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px;background:var(--bg)}
.formel .eyebrow{margin:0}
.f-eq{font-family:'Times New Roman',Georgia,serif;font-size:1.7rem;font-weight:700;text-align:center;letter-spacing:.02em}
.f-eq i{font-size:1em}
.f-leg{display:grid;gap:6px;font-size:.92rem}
.f-leg > span{display:flex;gap:10px;align-items:baseline}
.f-leg .sym{font-family:'Times New Roman',Georgia,serif;font-style:italic;font-weight:700;font-size:1.25rem;min-width:1.1em;text-align:center}
.cm{color:var(--gold)} .cb{color:var(--pine)}
#o-m,#o-m1,#o-m2{color:var(--gold)} #o-b,#o-b1,#o-b2{color:var(--pine)}
.bigeq .cm,.bigeq .cb{font-weight:800}

/* Plot */
.plot{width:100%;height:auto;display:block;max-width:420px;margin-inline:auto;touch-action:manipulation}
.plot .pl-bg{fill:var(--plotbg)}
.plot .pl-grid{stroke:var(--grid);stroke-width:1;fill:none}
.plot .pl-axis{stroke:var(--axis);stroke-width:1.5;fill:none}
.plot .pl-arrow{fill:var(--axis)}
.plot text{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
.plot .pl-name{fill:var(--ink);font-family:'Times New Roman',Georgia,serif;font-style:italic;font-size:15px}
.plot .ln{fill:none;stroke-width:3;stroke-linecap:round}
.plot .ln.a{stroke:var(--sky)} .plot .ln.b{stroke:var(--trail)} .plot .ln.c{stroke:var(--pine)} .plot .ln.d{stroke:var(--violet)}
.plot .ln.ref{stroke:var(--muted);stroke-dasharray:6 6;stroke-width:2}
.plot .tri{fill:color-mix(in srgb,var(--gold) 18%,transparent);stroke:var(--gold);stroke-width:2}
.plot .tri-l{fill:var(--gold);font-weight:700;font-size:12px}
.plot .guide{stroke:var(--trail);stroke-width:1.6;stroke-dasharray:4 4;fill:none}
.plot .pt-c{fill:var(--trail);stroke:var(--plotbg);stroke-width:2}
.plot .pt-c.a{fill:var(--sky)} .plot .pt-c.c{fill:var(--pine)} .plot .pt-c.g{fill:var(--gold)}
.plot .pt-c.drag{fill:var(--trail);stroke:var(--surface);stroke-width:3;cursor:grab}
.plot .pt-l{fill:var(--ink);font-weight:700;font-size:12px}
.drag-host .plot{touch-action:none}

/* Entdecken */
.ex{display:grid;gap:22px}
.ex-box{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:20px;display:grid;gap:16px}
.ex-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,400px);gap:22px;align-items:start}
.ex-ctrl{display:grid;gap:14px;align-content:start;min-width:0}
.sl{display:grid;gap:4px}
.sl label{display:flex;justify-content:space-between;font-weight:700}
.sl output{font-family:var(--f-mono);color:var(--sky)}
input[type=range]{width:100%;accent-color:var(--trail);height:28px}
.bigeq{font-size:1.4rem;padding:10px 14px;background:var(--surface-2);border-radius:10px;text-align:center;overflow-x:auto}
.merke{border-left:5px solid var(--trail);background:var(--surface);border-radius:4px 14px 14px 4px;padding:16px 18px;box-shadow:var(--shadow);display:grid;gap:8px}
.merke h3{display:flex;align-items:center;gap:8px}
.merke ul{margin:0;padding-left:1.2em;display:grid;gap:6px}
.qs{display:grid;gap:14px}
.qs-head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.fm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fm-box{font-family:var(--f-mono);font-weight:700;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;white-space:nowrap}
.fm-out{font-family:var(--f-mono);font-weight:700;font-size:1.2rem;min-width:3ch;text-align:center;padding:8px 12px;border-radius:9px;border:1.5px dashed var(--line)}
.fm-out.pop{animation:pop .4s}
@keyframes pop{40%{transform:scale(1.25);border-color:var(--trail)}}
.note{font-size:.92rem;color:var(--muted)}
.check-line{display:flex;gap:8px;align-items:center;font-size:.95rem}
.ggb{font-size:.9rem;color:var(--sky);font-weight:700}

/* Prüfung */
.gate{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:22px;display:grid;gap:14px;max-width:720px}
.gate.wide{max-width:none}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:.8rem;font-weight:700;background:var(--surface-2);color:var(--muted)}
.dot.cur{background:var(--sky);color:#fff}
.dot.y{background:var(--ok);color:#fff} .dot.n{background:var(--bad);color:#fff} .dot.d{background:var(--muted);color:var(--surface)}
.res-list{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.res-list li{display:flex;gap:10px;align-items:center;padding:8px 12px;background:var(--bg);border-radius:9px;flex-wrap:wrap}
.res-list li .ic{color:var(--ok)} .res-list li.n .ic{color:var(--bad)}
.res-list li .go{margin-left:auto}
.score{font-family:var(--f-display);font-stretch:125%;font-weight:900;font-size:3rem;line-height:1}
.bonus-grid{display:grid;gap:14px}
.bcard{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:16px 18px;display:grid;gap:12px}
.bcard .top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.bcard .gemic{color:var(--violet)}
.bcard.got{outline:2px solid var(--violet)}
.bcard .task{box-shadow:none;padding:0}
.pr-top{display:flex;gap:16px;align-items:end;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.pr-top .meter{display:grid;gap:6px;min-width:min(320px,100%);flex:1 1 420px}
.pr-top select{font:inherit;padding:8px 10px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);max-width:100%}
.types{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.types .chip{border:0;cursor:pointer}
.types .chip:not(.ok):hover{background:var(--line);color:var(--ink)}
.pr-top label{display:grid;gap:4px;font-size:.88rem;font-weight:700;min-width:0}

/* Modals & Toasts */
.overlay{position:fixed;inset:0;background:color-mix(in srgb,#05090c 60%,transparent);z-index:50;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:18px;padding:24px;max-width:520px;width:100%;display:grid;gap:14px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);max-height:100%;overflow:auto}
.codebox{font-family:var(--f-mono);font-weight:700;font-size:clamp(1.05rem,4.6vw,1.5rem);letter-spacing:.06em;background:var(--surface-2);padding:14px;border-radius:12px;text-align:center;word-break:break-all;user-select:all}
.door-scene{display:grid;place-items:center;padding:8px 0 4px;perspective:700px}
.door-frame{width:120px;height:170px;border:8px solid var(--rock-2);border-bottom:0;border-radius:60px 60px 0 0;position:relative;overflow:hidden;background:linear-gradient(var(--gold-soft),var(--gold))}
.door-panel{position:absolute;inset:0;background:var(--trail);border-radius:52px 52px 0 0;transform-origin:left center;animation:dopen 1.3s .5s cubic-bezier(.3,.7,.2,1) forwards;display:grid;place-items:center}
.door-panel::before{content:"";position:absolute;inset:14px;border:3px solid color-mix(in srgb,#fff 35%,transparent);border-radius:40px 40px 4px 4px}
.door-panel .knob{position:absolute;right:16px;top:52%;width:12px;height:12px;border-radius:50%;background:var(--gold)}
@keyframes dopen{to{transform:rotateY(-105deg)}}
.keyfly{position:absolute;color:var(--gold);animation:kfly .6s ease-out}
@keyframes kfly{from{transform:translateY(-40px) scale(1.6);opacity:0}}
.toasts{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;display:grid;gap:8px;justify-items:end;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-weight:700;display:flex;gap:10px;align-items:center;box-shadow:0 12px 30px -10px rgba(0,0,0,.45);animation:tin .35s ease-out}
.toast .big{font-family:var(--f-mono);color:var(--gold)}
@keyframes tin{from{transform:translateY(14px);opacity:0}}

@media (max-width:820px){
  .start,.ex-grid{grid-template-columns:minmax(0,1fr)}
  .task.has-plot .task-body{grid-template-columns:minmax(0,1fr)}
  .stats .stat small{display:none}
}
@media (max-width:520px){
  .howto{grid-template-columns:minmax(0,1fr)}
  .task,.ex-box,.gate{padding:16px}
  .hud-in{gap:8px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
  .door-panel{transform:rotateY(-105deg)}
}
</style>

<header class="hud" id="hud"></header>
<main id="main"></main>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="modal-root"></div>

<script>
"use strict";
const HAS_DOM = typeof document !== 'undefined';

/* =========================================================
   Zahlen, Zufall, Formatierung
   ========================================================= */
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const nz=(a,b)=>{let v;do{v=rnd(a,b)}while(v===0);return v;};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const near=(a,b,t=1e-6)=>Math.abs(a-b)<=t;
const isInt=n=>near(n,Math.round(n),1e-9);
function ratio(n){for(let d=1;d<=12;d++){const k=n*d;if(isInt(k))return[Math.round(k),d];}return null;}
const den=n=>{const r=ratio(n);return r?r[1]:1;};
const MINUS='−';
function dz(n){
  if(isInt(n)) n=Math.round(n);
  if(Object.is(n,-0)) n=0;
  const s=String(Math.round(n*1000)/1000);
  return (s[0]==='-'?MINUS+s.slice(1):s).replace('.',',');
}
function money(n){return (Math.round(n*100)/100).toFixed(2).replace('.',',')+' €';}
function fr(n){
  const r=ratio(n);
  if(!r||r[1]===1) return dz(n);
  const s=r[0]<0?MINUS:'';
  return `${s}<span class="fr"><span>${Math.abs(r[0])}</span><span>${r[1]}</span></span>`;
}
const par=n=>n<0?`(${dz(n)})`:dz(n);
const parF=n=>n<0?`(${fr(n)})`:fr(n);
const sg=n=>n>=0?`+ ${dz(n)}`:`${MINUS} ${dz(-n)}`;
const X='<i>x</i>', Yv='<i>y</i>', F='<i>f</i>(<i>x</i>)';
function term(m,b){
  let t;
  if(near(m,0)) return dz(b);
  t = near(m,1)?X : near(m,-1)? MINUS+X : fr(m)+X;
  if(!near(b,0)) t+=' '+sg(b);
  return t;
}
const eqH=(m,b,lhs=Yv)=>`<span class="eq">${lhs} = ${term(m,b)}</span>`;
const P=(name,x,y)=>`<span class="pt">${name}(${dz(x)}&#8201;|&#8201;${dz(y)})</span>`;

function parseNum(s){
  if(s==null) return NaN;
  s=String(s).replace(/\s+/g,'').replace(/[−–]/g,'-').replace(/,/g,'.');
  if(s.includes('=')) s=s.slice(s.lastIndexOf('=')+1);
  s=s.replace(/(€|euro|cm|km|min|hm|m|l|h|%)$/i,'');
  if(/^[+-]?(\d+\.?\d*|\.\d+)\/[+-]?(\d+\.?\d*|\.\d+)$/.test(s)){const [a,b]=s.split('/');const d=parseFloat(b);return d===0?NaN:parseFloat(a)/d;}
  if(/^[+-]?(\d+\.?\d*|\.\d+)$/.test(s)) return parseFloat(s);
  return NaN;
}
function parseExpr(str){
  let s=String(str).toLowerCase().replace(/\s+/g,'').replace(/[−–]/g,'-').replace(/[·×⋅]/g,'*').replace(/,/g,'.');
  const e=s.lastIndexOf('=');
  if(e>=0){const lhs=s.slice(0,e); if(!/^(y|[fgh]\(x\)|[fgh])$/.test(lhs)) return null; s=s.slice(e+1);}
  if(!s) return null;
  const toks=[];let i=0;
  while(i<s.length){const c=s[i];
    if(/[0-9.]/.test(c)){let j=i;while(j<s.length&&/[0-9.]/.test(s[j]))j++;const v=Number(s.slice(i,j));if(isNaN(v))return null;toks.push({t:'n',v});i=j;continue;}
    if(c==='x'){toks.push({t:'x'});i++;continue;}
    if('+-*/()'.includes(c)){toks.push({t:c});i++;continue;}
    return null;}
  const t=[];
  for(const a of toks){const p=t[t.length-1];if(p&&(p.t==='n'||p.t==='x'||p.t===')')&&(a.t==='n'||a.t==='x'||a.t==='('))t.push({t:'*'});t.push(a);}
  let pos=0;const pk=()=>t[pos];
  function ex(){let v=tm();while(pk()&&(pk().t==='+'||pk().t==='-')){const op=t[pos++].t,r=tm(),l=v;v=op==='+'?(x=>l(x)+r(x)):(x=>l(x)-r(x));}return v;}
  function tm(){let v=un();while(pk()&&(pk().t==='*'||pk().t==='/')){const op=t[pos++].t,r=un(),l=v;v=op==='*'?(x=>l(x)*r(x)):(x=>l(x)/r(x));}return v;}
  function un(){if(pk()&&(pk().t==='-'||pk().t==='+')){const op=t[pos++].t,u=un();return op==='-'?(x=>-u(x)):u;}return at();}
  function at(){const k=t[pos++];if(!k)throw 0;if(k.t==='n'){const v=k.v;return()=>v;}if(k.t==='x')return x=>x;if(k.t==='('){const v=ex();if(!pk()||pk().t!==')')throw 0;pos++;return v;}throw 0;}
  try{const f=ex();return pos===t.length?f:null;}catch(err){return null;}
}
function parseLinear(str){
  const f=parseExpr(str); if(!f) return null;
  const y0=f(0),y1=f(1),y2=f(2),y3=f(-3);
  if(![y0,y1,y2,y3].every(Number.isFinite)) return null;
  const m=y1-y0;
  if(!near(y2-y1,m,1e-9)||!near(y0-y3,3*m,1e-9)) return {nonlinear:true};
  return {m,b:y0};
}

/* =========================================================
   Koordinatensystem (SVG)
   ========================================================= */
let PLOT_ID=0;
const PW=360,PH=360;
function plotSVG(cfg){
  const c=Object.assign({xmin:-6,xmax:6,ymin:-6,ymax:6,gx:1,gy:1,lx:0,ly:0,lines:[],points:[],segs:[],tris:[],xlab:'x',ylab:'y'},cfg||{});
  const {xmin,xmax,ymin,ymax}=c;
  const sx=x=>(x-xmin)/(xmax-xmin)*PW, sy=y=>PH-(y-ymin)/(ymax-ymin)*PH;
  const lx=c.lx||c.gx*((xmax-xmin)/c.gx>13?2:1), ly=c.ly||c.gy*((ymax-ymin)/c.gy>13?2:1);
  const id='cp'+(++PLOT_ID);
  const PL=34,PR=16,PT=16,PB=26;
  let s=`<svg class="plot" viewBox="${-PL} ${-PT} ${PW+PL+PR} ${PH+PT+PB}" role="img" aria-label="${c.aria||'Koordinatensystem'}"><defs><clipPath id="${id}"><rect x="0" y="0" width="${PW}" height="${PH}"/></clipPath></defs>`;
  s+=`<rect class="pl-bg" x="0" y="0" width="${PW}" height="${PH}"/>`;
  let g='';
  for(let x=Math.ceil(xmin/c.gx-1e-9)*c.gx;x<=xmax+1e-9;x+=c.gx) g+=`M${sx(x).toFixed(1)} 0V${PH}`;
  for(let y=Math.ceil(ymin/c.gy-1e-9)*c.gy;y<=ymax+1e-9;y+=c.gy) g+=`M0 ${sy(y).toFixed(1)}H${PW}`;
  s+=`<path class="pl-grid" d="${g}"/>`;
  const ax=(ymin<=0&&ymax>=0)?sy(0):PH, ay=(xmin<=0&&xmax>=0)?sx(0):0;
  s+=`<path class="pl-axis" d="M0 ${ax}H${PW+10}M${ay} ${PH}V-10"/><path class="pl-arrow" d="M${PW+12} ${ax}l-9 -4.5v9z M${ay} -12l-4.5 9h9z"/>`;
  for(let x=Math.ceil(xmin/lx-1e-9)*lx;x<=xmax+1e-9;x+=lx){ if(near(x,0)&&xmin<0) continue; if(near(x,xmax)) continue; s+=`<text x="${sx(x)}" y="${ax+15}" text-anchor="middle">${dz(x)}</text>`; }
  for(let y=Math.ceil(ymin/ly-1e-9)*ly;y<=ymax+1e-9;y+=ly){ if(near(y,0)&&ymin<0) continue; if(near(y,ymax)) continue; s+=`<text x="${ay-6}" y="${sy(y)+4}" text-anchor="end">${dz(y)}</text>`; }
  if(xmin<0&&ymin<0) s+=`<text x="${ay-6}" y="${ax+15}" text-anchor="end">0</text>`;
  s+=`<text class="pl-name" x="${PW+4}" y="${ax-9}" text-anchor="end">${c.xlab}</text><text class="pl-name" x="${ay+9}" y="2">${c.ylab}</text>`;
  s+=`<g clip-path="url(#${id})">`;
  for(const t of c.tris){
    const x1=sx(t.x0),y1=sy(t.y0),x2=sx(t.x0+t.dx),y2=sy(t.y0+t.dy);
    s+=`<path class="tri" d="M${x1} ${y1}H${x2}V${y2}Z"/>`;
    s+=`<text class="tri-l" x="${(x1+x2)/2}" y="${y1+(t.dy>0?16:-7)}" text-anchor="middle">${dz(t.dx)}</text>`;
    s+=`<text class="tri-l" x="${x2+(t.dx>0?6:-6)}" y="${(y1+y2)/2+4}" text-anchor="${t.dx>0?'start':'end'}">${t.dy>0?'+':''}${dz(t.dy)}</text>`;
  }
  for(const g2 of c.segs) s+=`<path class="${g2.cls||'guide'}" d="M${sx(g2.x1)} ${sy(g2.y1)}L${sx(g2.x2)} ${sy(g2.y2)}"/>`;
  for(const l of c.lines){
    const a=l.from??xmin, b=l.to??xmax;
    s+=`<path class="ln ${l.cls||'a'}" d="M${sx(a).toFixed(2)} ${sy(l.m*a+l.b).toFixed(2)}L${sx(b).toFixed(2)} ${sy(l.m*b+l.b).toFixed(2)}"/>`;
    if(l.label){const lxp=l.lx??(xmax-1.2);s+=`<text class="pt-l" x="${sx(lxp)}" y="${sy(l.m*lxp+l.b)-10}" text-anchor="middle">${l.label}</text>`;}
  }
  s+='</g>';
  for(const p of c.points){
    if(p.x<xmin-1e-9||p.x>xmax+1e-9||p.y<ymin-1e-9||p.y>ymax+1e-9) continue;
    s+=`<circle class="pt-c ${p.cls||''}" cx="${sx(p.x)}" cy="${sy(p.y)}" r="${p.r||5.5}"/>`;
    if(p.label) s+=`<text class="pt-l" x="${sx(p.x)+(p.dx??8)}" y="${sy(p.y)+(p.dy??-9)}" text-anchor="${p.anchor||'start'}">${p.label}</text>`;
  }
  return s+'</svg>';
}

/* =========================================================
   Aufgaben-Generatoren
   ========================================================= */
const MS=[-3,-2,-1.5,-1,-2/3,-0.5,-1/3,1/3,0.5,2/3,1,1.5,2,3];
const HB='Beispiel';
function lineMB(list=MS){
  for(;;){const m=pick(list),b=rnd(-4,4),q=den(m),p=m*q;if(Math.abs(b+p)<=5&&Math.abs(b-p)<=6)return{m,b};}
}
function slopeTri(m,b){const q=den(m);return{x0:0,y0:b,dx:q,dy:m*q};}
function choiceTask(o){return Object.assign({kind:'choice'},o);}
const JN=['Ja, P liegt auf dem Graphen.','Nein, P liegt nicht auf dem Graphen.'];

const G={};
/* ---- Etappe 1 ---- */
G.fval={name:'Funktionswert berechnen',make(){
  const a=nz(-4,5),c=rnd(-6,6),k=rnd(-4,6),sol=a*k+c;
  const W={2:'verdoppelt',3:'verdreifacht',4:'vervierfacht',5:'verfünffacht'};
  const word=W[a]&&Math.random()<.4;
  const def=word?`Die Funktion <i>f</i> ${W[a]} jede Zahl${c===0?'':c>0?` und addiert dann ${c}`:` und subtrahiert dann ${-c}`}.`:`Gegeben ist die Funktion ${eqH(a,c,F)}.`;
  return {kind:'num',q:`${def} Berechne den Funktionswert <b><i>f</i>(${dz(k)})</b>.`,sol,
    hints:[`Setze für ${X} die Zahl ${dz(k)} ein.${k<0?' Negative Zahlen setzt du in Klammern.':''}`,
      `Punkt vor Strich: Rechne zuerst ${dz(a)} · ${par(k)}${c!==0?`, danach ${sg(c)}`:''}.`,
      `${HB}: <i>f</i>(${X}) = 3${X} − 2. Dann ist <i>f</i>(4) = 3 · 4 − 2 = 12 − 2 = 10.`],
    explain:`<i>f</i>(${dz(k)}) = ${dz(a)} · ${par(k)}${c!==0?' '+sg(c):''} = ${dz(sol)}. Der Punkt ${P('',k,sol)} liegt auf dem Graphen.`};
}};
G.table={name:'Wertetabelle ausfüllen',make(){
  const a=nz(-3,3),c=rnd(-4,4),xs=shuffle([-3,-2,-1,0,1,2,3,4]).slice(0,4).sort((p,q)=>p-q);
  return {kind:'table',xs,sol:xs.map(x=>a*x+c),q:`Fülle die Wertetabelle für ${eqH(a,c,F)} aus.`,
    hints:['Jede Spalte ist eine eigene Rechnung: Setze den x-Wert darüber in die Funktionsgleichung ein.',
      `Kontrolle: Wenn ${X} um 1 größer wird, ändert sich ${Yv} bei dieser Funktion immer um denselben Betrag.`,
      `${HB}: <i>f</i>(${X}) = 2${X} − 1 und ${X} = −2: <i>f</i>(−2) = 2 · (−2) − 1 = −4 − 1 = −5.`],
    explain:`Jeder x-Wert wird eingesetzt: ${xs.map(x=>`<i>f</i>(${dz(x)}) = ${dz(a*x+c)}`).join(', ')}.`};
}};
G.read={name:'Am Graphen ablesen',make(){
  for(;;){
    const m=pick([-2,-1,-0.5,0.5,1,2,1.5,-1.5]),b=rnd(-3,3),ks=[];
    for(let k=-5;k<=5;k++){const y=m*k+b;if(k!==0&&isInt(y)&&Math.abs(y)<=5)ks.push(k);}
    if(ks.length<2) continue;
    const k=pick(ks),y=m*k+b,inv=Math.random()<.4;
    const plot={lines:[{m,b,cls:'a'}]};
    const after={lines:[{m,b,cls:'a'}],points:[{x:k,y,label:P('',k,y).replace(/<[^>]+>/g,'')}],segs:[{x1:k,y1:0,x2:k,y2:y},{x1:0,y1:y,x2:k,y2:y}]};
    if(!inv) return {kind:'num',plot,after,sol:y,q:`Das ist der Graph einer Funktion <i>f</i>. Lies ab: Welchen Funktionswert hat <i>f</i> an der Stelle ${X} = ${dz(k)}?`,
      hints:[`Suche auf der x-Achse die Zahl ${dz(k)}.`,'Gehe von dort senkrecht nach oben oder unten, bis du den Graphen triffst. Gehe dann waagerecht zur y-Achse und lies ab.',`${HB}: Trifft die senkrechte Linie bei ${X} = 2 den Graphen auf Höhe 3, dann ist <i>f</i>(2) = 3.`],
      explain:`An der Stelle ${dz(k)} liegt der Graph auf der Höhe ${dz(y)}. Also gilt <i>f</i>(${dz(k)}) = ${dz(y)}.`};
    return {kind:'num',plot,after,sol:k,q:`Das ist der Graph einer Funktion <i>f</i>. Lies ab: An welcher Stelle ${X} hat <i>f</i> den Funktionswert ${dz(y)}?`,
      hints:[`Suche auf der y-Achse die Zahl ${dz(y)}.`,'Gehe von dort waagerecht, bis du den Graphen triffst. Gehe dann senkrecht zur x-Achse und lies ab.',`${HB}: Liegt der Graph auf Höhe 4 genau über ${X} = −1, dann ist <i>f</i>(−1) = 4. Gesucht wäre dann ${X} = −1.`],
      explain:`Auf der Höhe ${dz(y)} liegt der Graph über der Stelle ${X} = ${dz(k)}.`};
  }
}};
G.isfunc={name:'Funktion oder nicht?',make(){
  const isF=Math.random()<.5;
  const xs=shuffle([-3,-2,-1,0,1,2,3,4]).slice(0,5),ys=xs.map(()=>rnd(-4,6));
  let dup=null;
  if(isF){ys[1]=ys[0];}else{xs[4]=xs[1];dup=xs[1];while(ys[4]===ys[1])ys[4]=rnd(-4,6);}
  const ord=shuffle([0,1,2,3,4]);
  const tbl=`<div class="tbl-scroll"><table class="vt"><tr><th>x</th>${ord.map(i=>`<td>${dz(xs[i])}</td>`).join('')}</tr><tr><th>y</th>${ord.map(i=>`<td>${dz(ys[i])}</td>`).join('')}</tr></table></div>`;
  return choiceTask({q:`Gehört diese Zuordnung zu einer Funktion?${tbl}`,options:['Ja, das ist eine Funktion.','Nein, das ist keine Funktion.'],noShuffle:true,sol:isF?0:1,
    hints:['Bei einer Funktion gehört zu jedem x-Wert genau ein y-Wert.','Schau nur in die x-Zeile: Kommt ein x-Wert mehrfach vor, und zwar mit verschiedenen y-Werten? Gleiche y-Werte sind dagegen erlaubt.',`${HB}: (1|3) und (1|5) in einer Tabelle: keine Funktion. (1|3) und (2|3): erlaubt.`],
    explain:isF?'Jeder x-Wert kommt genau einmal vor. Dass zwei x-Werte denselben y-Wert haben, ist erlaubt.':`Der x-Wert ${dz(dup)} hat zwei verschiedene y-Werte. Das ist bei einer Funktion nicht erlaubt.`});
}};
G.point={name:'Tabelle und Punkt',make(){
  let a,b;do{a=nz(-5,5);b=nz(-5,5);}while(Math.abs(a)===Math.abs(b));
  const opts=[P('',a,b),P('',b,a),P('',-a,b),P('',a,-b)];
  return choiceTask({q:`In der Wertetabelle einer Funktion steht unter ${X} = ${dz(a)} der Wert ${Yv} = ${dz(b)}. Welcher Punkt liegt deshalb auf dem Graphen?`,options:opts,sol:0,
    hints:['Ein Punkt wird immer als (x-Wert | y-Wert) geschrieben.','Der x-Wert steht zuerst, danach der y-Wert. Achte auf die Vorzeichen.',`${HB}: ${X} = 4 und ${Yv} = −1 ergibt den Punkt (4 | −1).`],
    explain:`Zuerst der x-Wert, dann der y-Wert: ${P('',a,b)}.`});
}};
/* ---- Etappe 2 ---- */
G.mgraph={name:'Steigung am Graphen',make(){
  const m=pick(MS),q=den(m),p=m*q;
  return {kind:'num',plot:{lines:[{m,b:0,cls:'a'}]},sol:m,q:`Der Graph gehört zu einer Funktion der Form <span class="eq">${Yv} = <i>m</i>${X}</span>. Bestimme die Steigung <i>m</i>. Brüche wie 2/3 sind erlaubt.`,
    after:{lines:[{m,b:0,cls:'a'}],tris:[slopeTri(m,0)]},
    hints:['Der Graph geht durch den Ursprung (0|0). Suche einen zweiten Punkt, an dem der Graph genau ein Gitterkreuz trifft.','Zeichne ein Steigungsdreieck: von (0|0) waagerecht nach rechts, dann senkrecht bis zum Graphen. m = senkrechte Strecke : waagerechte Strecke. Geht es nach unten, ist m negativ.',`${HB}: Ein Graph trifft (3|2). Von (0|0) aus: 3 nach rechts, 2 nach oben. Also m = 2/3.`],
    explain:`Von (0|0) aus ${q} nach rechts und ${dz(Math.abs(p))} nach ${p>0?'oben':'unten'}: <i>m</i> = ${fr(m)}.`};
}};
G.mpoint={name:'Steigung aus einem Punkt',make(){
  for(;;){const m=pick([-3,-2.5,-2,-1.5,-1,-0.5,0.5,1,1.5,2,2.5,3,4,-4]),x=nz(-6,6),y=m*x;if(!isInt(y)||Math.abs(y)>15||y===0)continue;
    return {kind:'num',sol:m,q:`Der Graph einer Funktion <span class="eq">${Yv} = <i>m</i>${X}</span> verläuft durch ${P('P',x,y)}. Bestimme die Steigung <i>m</i>.`,
      hints:[`Setze die Koordinaten von P in ${Yv} = <i>m</i> · ${X} ein.`,`Du erhältst ${dz(y)} = <i>m</i> · ${par(x)}. Teile beide Seiten durch ${par(x)}.`,`${HB}: P(4|10): 10 = <i>m</i> · 4, also <i>m</i> = 10 : 4 = 2,5.`],
      explain:`${dz(y)} = <i>m</i> · ${par(x)} ⇒ <i>m</i> = ${dz(y)} : ${par(x)} = ${dz(m)}.`};}
}};
function probeTask(withB){
  const {m,b}=withB?lineMB():{m:pick(MS),b:0};
  const q=den(m);let x;do{x=q*nz(-3,3);}while(Math.abs(x)>8);
  const on=Math.random()<.5,yt=m*x+b,y=on?yt:yt+nz(-2,2);
  return choiceTask({q:`Liegt der Punkt ${P('P',x,y)} auf dem Graphen von ${eqH(m,b)}? Mache die Punktprobe.`,options:JN,noShuffle:true,sol:on?0:1,
    hints:[`Punktprobe: Setze den x-Wert von P in die Gleichung ein und vergleiche das Ergebnis mit dem y-Wert von P.`,`Rechne ${fr(m)} · ${par(x)}${b?' '+sg(b):''} aus. Kommt genau ${dz(y)} heraus?`,`${HB}: P(3|7) und ${Yv} = 2${X}: 2 · 3 = 6 ≠ 7. P liegt nicht auf dem Graphen.`],
    explain:`${fr(m)} · ${par(x)}${b?' '+sg(b):''} = ${dz(yt)} ${on?'=':'≠'} ${dz(y)}. P liegt ${on?'':'nicht '}auf dem Graphen.`});
}
G.probe2={name:'Punktprobe bei y = mx',make:()=>probeTask(false)};
function missingTask(withB){
  const {m,b}=withB?lineMB():{m:pick(MS),b:0};
  const q=den(m);let x;do{x=q*nz(-3,3);}while(Math.abs(x)>9);
  const y=m*x+b,askY=Math.random()<.55||near(m,0);
  const eqs=eqH(m,b);
  if(askY) return {kind:'num',sol:y,q:`Der Punkt <span class="pt">P(${dz(x)}&#8201;|&#8201;?)</span> liegt auf dem Graphen von ${eqs}. Bestimme die fehlende y-Koordinate.`,
    hints:['Setze den bekannten x-Wert in die Gleichung ein.',`Rechne ${fr(m)} · ${par(x)}${b?' '+sg(b):''}.`,`${HB}: ${Yv} = 3${X} − 1 und P(2|?): ${Yv} = 3 · 2 − 1 = 5.`],
    explain:`${Yv} = ${fr(m)} · ${par(x)}${b?' '+sg(b):''} = ${dz(y)}, also ${P('P',x,y)}.`};
  return {kind:'num',sol:x,q:`Der Punkt <span class="pt">P(?&#8201;|&#8201;${dz(y)})</span> liegt auf dem Graphen von ${eqs}. Bestimme die fehlende x-Koordinate.`,
    hints:[`Setze den bekannten y-Wert für ${Yv} ein: ${dz(y)} = ${term(m,b)}.`,b?`Bringe zuerst ${dz(b)} auf die andere Seite, dann teile durch ${parF(m)}.`:`Teile beide Seiten durch ${parF(m)}.`,`${HB}: ${Yv} = 2${X} + 1 und P(?|9): 9 = 2${X} + 1 ⇒ 8 = 2${X} ⇒ ${X} = 4.`],
    explain:`${dz(y)} = ${term(m,b)} ⇒ ${X} = ${dz(x)}, also ${P('P',x,y)}.`};
}
G.missing2={name:'Fehlende Koordinate (y = mx)',make:()=>missingTask(false)};
G.steep={name:'Welcher Graph ist steiler?',make(){
  const abs=shuffle([0.5,1,1.5,2,3,1/3,2/3,4]).slice(0,4);
  const ms=abs.map(a=>a*(Math.random()<.5?-1:1));
  const best=abs.indexOf(Math.max(...abs));
  return choiceTask({q:'Welcher Graph verläuft am steilsten?',options:ms.map(m=>eqH(m,0)),sol:best,
    hints:['Das Vorzeichen von m sagt nur, ob der Graph steigt oder fällt.','Für die Steilheit zählt nur der Betrag von m, also die Zahl ohne Vorzeichen. Je größer, desto steiler.',`${HB}: ${Yv} = −3${X} ist steiler als ${Yv} = 2${X}, weil 3 > 2.`],
    explain:`Der Betrag ${fr(abs[best])} ist der größte, also ist ${eqH(ms[best],0)} am steilsten.`});
}};
G.slider2={name:'Graph einstellen (y = mx)',make(){
  for(;;){const m=nz(-12,12)/4,x=nz(-5,5),y=m*x;if(!isInt(y)||Math.abs(y)>5||Math.abs(m)>3)continue;
    const init=near(m,1)?-1:1;
    return {kind:'slider',sliders:[{k:'m',min:-3,max:3,step:.25,init}],sol:{m},
      live:v=>({lines:[{m:v.m,b:0,cls:'a'}],points:[{x,y,label:`P(${dz(x)}|${dz(y)})`}]}),
      q:`Stelle die Steigung <i>m</i> so ein, dass der Graph von <span class="eq">${Yv} = <i>m</i>${X}</span> genau durch ${P('P',x,y)} verläuft.`,
      hints:['Der Graph muss genau durch den roten Punkt laufen.',`Rechne zur Kontrolle: m = ${dz(y)} : ${par(x)}.`,`${HB}: Für P(2|3) brauchst du m = 3 : 2 = 1,5.`],
      explain:`<i>m</i> = ${dz(y)} : ${par(x)} = ${dz(m)}.`};}
}};
/* ---- Etappe 3 ---- */
G.readb={name:'y-Achsenabschnitt ablesen',make(){
  const {m,b}=lineMB();
  return {kind:'num',plot:{lines:[{m,b,cls:'a'}]},sol:b,after:{lines:[{m,b,cls:'a'}],points:[{x:0,y:b,label:`(0|${dz(b)})`}]},
    q:`Der Graph gehört zu ${'<span class="eq"><i>y</i> = <i>m</i><i>x</i> + <i>b</i></span>'}. Lies den y-Achsenabschnitt <i>b</i> ab.`,
    hints:['b ist die Stelle, an der der Graph die y-Achse schneidet.','Folge der y-Achse (die senkrechte Achse) und suche den Schnittpunkt mit dem Graphen. Liegt er unter der x-Achse, ist b negativ.',`${HB}: Schneidet der Graph die y-Achse bei (0|−2), dann ist b = −2.`],
    explain:`Der Graph schneidet die y-Achse in (0|${dz(b)}), also <i>b</i> = ${dz(b)}.`};
}};
G.eqgraph={name:'Gleichung am Graphen ablesen',make(){
  const {m,b}=lineMB();
  return {kind:'eq',plot:{lines:[{m,b,cls:'a'}]},sol:{m,b},after:{lines:[{m,b,cls:'a'}],tris:[slopeTri(m,b)],points:[{x:0,y:b,cls:'g'}]},
    q:'Bestimme die Funktionsgleichung des Graphen.',
    hints:['Lies zuerst b ab: Wo schneidet der Graph die y-Achse?','Zeichne vom Punkt (0|b) aus ein Steigungsdreieck: Wie viele Kästchen nach rechts, wie viele nach oben oder unten, bis du wieder auf dem Graphen bist? m = oben/unten : rechts.',`${HB}: Schnitt bei (0|−1), von dort 2 nach rechts und 3 nach oben ⇒ ${Yv} = 3/2 ${X} − 1.`],
    explain:`<i>b</i> = ${dz(b)} und <i>m</i> = ${fr(m)}, also ${eqH(m,b)}.`};
}};
G.probe3={name:'Punktprobe bei y = mx + b',make:()=>probeTask(true)};
G.match={name:'Gleichung zum Graphen',make(){
  let m,b;do{({m,b}=lineMB());}while(b===0);
  const cand=[[m,b],[-m,b],[m,-b]];
  if(!near(m,b)&&isInt(m)&&Math.abs(b)<=3) cand.push([b,m]); else cand.push([m,b+(b>0?2:-2)]);
  return choiceTask({plot:{lines:[{m,b,cls:'a'}]},q:'Welche Gleichung gehört zu diesem Graphen?',options:cand.map(([a,c])=>eqH(a,c)),sol:0,
    hints:['Prüfe zuerst b: Wo schneidet der Graph die y-Achse?','Steigt oder fällt der Graph von links nach rechts? Das verrät dir das Vorzeichen von m.','Bleiben noch zwei Gleichungen übrig, prüfe mit einem Steigungsdreieck oder einer Punktprobe.'],
    explain:`Schnitt mit der y-Achse bei ${dz(b)}, Steigung ${fr(m)}: ${eqH(m,b)}.`});
}};
G.parallel={name:'Parallele Gerade',make(){
  const m=pick(MS);let c=rnd(-4,4),b;do{b=rnd(-5,5);}while(b===c);
  return {kind:'eq',sol:{m,b},q:`Die Gerade <i>g</i> hat die Gleichung ${eqH(m,c)}. Gib die Gleichung der Geraden <i>h</i> an, die parallel zu <i>g</i> ist und die y-Achse im Punkt (0&#8201;|&#8201;${dz(b)}) schneidet.`,
    after:{lines:[{m,b:c,cls:'ref'},{m,b,cls:'b'}]},
    hints:['Parallele Geraden haben dieselbe Steigung.','Der Punkt auf der y-Achse verrät dir den y-Achsenabschnitt b der neuen Geraden.',`${HB}: Parallel zu ${Yv} = 3${X} − 1 mit Schnittpunkt (0|4) ⇒ ${Yv} = 3${X} + 4.`],
    explain:`Gleiche Steigung ${fr(m)}, neues <i>b</i> = ${dz(b)}: ${eqH(m,b)}.`};
}};
G.missing3={name:'Fehlende Koordinate (y = mx + b)',make:()=>missingTask(true)};
G.slider3={name:'Graph einstellen (y = mx + b)',make(){
  for(;;){const m=nz(-6,6)/2,b=rnd(-4,4),q=den(m);const x1=q*nz(-2,2),x2=q*nz(-2,2);if(x1===x2)continue;const y1=m*x1+b,y2=m*x2+b;if(Math.abs(y1)>5||Math.abs(y2)>5)continue;
    return {kind:'slider',sliders:[{k:'m',min:-3,max:3,step:.5,init:near(m,1)?-1:1},{k:'b',min:-5,max:5,step:1,init:b===0?2:0}],sol:{m,b},
      live:v=>({lines:[{m:v.m,b:v.b,cls:'a'}],points:[{x:x1,y:y1,label:'A'},{x:x2,y:y2,label:'B'}]}),
      q:`Stelle <i>m</i> und <i>b</i> so ein, dass der Graph durch ${P('A',x1,y1)} und ${P('B',x2,y2)} verläuft.`,
      hints:['Stelle zuerst b ein: Wo müsste die Gerade durch A und B die y-Achse schneiden?','Dann m: Wie viel geht es von A nach B nach oben oder unten, wenn du nach rechts gehst? Teile durch die Strecke nach rechts.',`${HB}: A(0|1) und B(2|5): b = 1, m = (5 − 1) : 2 = 2.`],
      explain:`${eqH(m,b)} verläuft durch A und B.`};}
}};
/* ---- Etappe 4 ---- */
function niceLine(){for(;;){const m=pick([-3,-2,-1.5,-1,-0.5,0.5,1,1.5,2,3,2/3,-2/3,1/3,-1/3]),b=rnd(-5,5);if(b!==0||Math.random()<.2)return{m,b};}}
function twoPts(m,b){const q=den(m);for(;;){const x1=q*nz(-3,3),x2=q*nz(-3,3);if(x1>=x2)continue;const y1=m*x1+b,y2=m*x2+b;if(Math.abs(y1)<=12&&Math.abs(y2)<=12)return[x1,y1,x2,y2];}}
G.mpt={name:'Gleichung aus Steigung und Punkt',make(){
  const {m,b}=niceLine(),q=den(m);let x;do{x=q*nz(-3,3);}while(Math.abs(x)>7);const y=m*x+b;
  return {kind:'eq',sol:{m,b},q:`Eine Gerade hat die Steigung <i>m</i> = ${fr(m)} und verläuft durch ${P('P',x,y)}. Bestimme ihre Funktionsgleichung.`,
    hints:[`Die Steigung kennst du schon: ${Yv} = ${fr(m)}${X} + <i>b</i>. Es fehlt nur noch <i>b</i>.`,`Setze die Koordinaten von P ein: ${dz(y)} = ${fr(m)} · ${par(x)} + <i>b</i>. Löse nach <i>b</i> auf.`,`${HB}: <i>m</i> = 2, P(3|1): 1 = 2 · 3 + <i>b</i> ⇒ 1 = 6 + <i>b</i> ⇒ <i>b</i> = −5 ⇒ ${Yv} = 2${X} − 5.`],
    explain:`${dz(y)} = ${fr(m)} · ${par(x)} + <i>b</i> ⇒ <i>b</i> = ${dz(b)}, also ${eqH(m,b)}.`,after:{lines:[{m,b,cls:'a'}],points:[{x,y,label:'P'}]}};
}};
G.twop={name:'Gleichung aus zwei Punkten',make(){
  const {m,b}=niceLine(),[x1,y1,x2,y2]=twoPts(m,b);
  return {kind:'eq',sol:{m,b},q:`Bestimme die Gleichung der Geraden durch ${P('A',x1,y1)} und ${P('B',x2,y2)}.`,
    hints:['Berechne zuerst die Steigung: <i>m</i> = (y₂ − y₁) : (x₂ − x₁).','Mit <i>m</i> und einem der beiden Punkte bestimmst du <i>b</i>: Punkt einsetzen und nach <i>b</i> auflösen.',`${HB}: A(1|3), B(4|9): <i>m</i> = (9 − 3) : (4 − 1) = 2. Dann 3 = 2 · 1 + <i>b</i> ⇒ <i>b</i> = 1 ⇒ ${Yv} = 2${X} + 1.`],
    explain:`<i>m</i> = (${dz(y2)} − ${par(y1)}) : (${dz(x2)} − ${par(x1)}) = ${fr(m)}, <i>b</i> = ${dz(b)}: ${eqH(m,b)}.`,after:{lines:[{m,b,cls:'a'}],points:[{x:x1,y:y1,label:'A'},{x:x2,y:y2,label:'B'}],ymin:-8,ymax:8,xmin:-8,xmax:8,ly:2,lx:2}};
}};
G.m2p={name:'Steigung aus zwei Punkten',make(){
  const {m,b}=niceLine(),[x1,y1,x2,y2]=twoPts(m,b);
  return {kind:'num',sol:m,q:`Berechne die Steigung der Geraden durch ${P('A',x1,y1)} und ${P('B',x2,y2)}.`,
    hints:['Steigung = Höhenunterschied : waagerechter Abstand.','<i>m</i> = (y₂ − y₁) : (x₂ − x₁). Achte auf Minus mal Minus.',`${HB}: A(−1|5), B(3|−3): <i>m</i> = (−3 − 5) : (3 − (−1)) = −8 : 4 = −2.`],
    explain:`<i>m</i> = (${dz(y2)} − ${par(y1)}) : (${dz(x2)} − ${par(x1)}) = ${dz(y2-y1)} : ${dz(x2-x1)} = ${fr(m)}.`};
}};
const HEFT_NOTE='<div class="heft"><svg class="ic" viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z M9 9h7 M9 13h7 M9 17h4"/></svg><span><b>Heft-Aufgabe:</b> Zeichne mit Lineal in dein Heft (1 Einheit = 1 cm = 2 Kästchen). Die Antwort gibst du hier ein.</span></div>';
G.heft={name:'Graph ins Heft zeichnen',make(){
  for(;;){const m=pick([-2,-1.5,-1,-0.5,0.5,1.5,2,2/3,-2/3,1/3,-1/3,3]),b=rnd(-4,4),q=den(m);
    const ks=[];for(let k=-5;k<=5;k++){const y=m*k+b;if(k!==0&&isInt(y)&&Math.abs(y)<=5&&k%q===0&&Math.abs(k)>=2)ks.push(k);}
    if(!ks.length)continue;const k=pick(ks),y=m*k+b,mc=Math.random()<.35;
    const base={heft:true,after:{lines:[{m,b,cls:'a'}],tris:[slopeTri(m,b)],points:[{x:0,y:b,cls:'g'},{x:k,y,label:`(${dz(k)}|${dz(y)})`}]},
      hints:[`Beginne mit <i>b</i>: Markiere den Punkt (0|${dz(b)}) auf der y-Achse.`,`Steigungsdreieck: <i>m</i> = ${fr(m)} heißt ${q} nach rechts und ${dz(Math.abs(m*q))} nach ${m>0?'oben':'unten'}. Wiederhole das zwei- oder dreimal und verbinde die Punkte mit dem Lineal.`,'Kontrolle: Setze einen deiner gezeichneten Punkte in die Gleichung ein. Stimmt die Punktprobe, ist deine Zeichnung richtig.'],
      explain:'Vergleiche mit deiner Zeichnung: Der Graph startet auf der y-Achse bei <i>b</i> und folgt dem Steigungsdreieck.'};
    if(!mc) return Object.assign(base,{kind:'num',sol:y,q:`${HEFT_NOTE}Zeichne den Graphen von ${eqH(m,b)} für ${X} von −5 bis 5. Lies dann ab: Welchen y-Wert hat der Graph bei ${X} = ${dz(k)}?`});
    const opts=[P('',k,y),P('',k,y+1),P('',k,y-(m>0?2:-2)),P('',-k,y)];
    return Object.assign(base,{kind:'choice',sol:0,options:opts,q:`${HEFT_NOTE}Zeichne den Graphen von ${eqH(m,b)}. Welcher dieser Punkte liegt auf deinem Graphen?`});}
}};
G.heft2={name:'Gerade durch zwei Punkte zeichnen',make(){
  for(;;){const m=pick([-2,-1,-0.5,0.5,1,2,1.5,-1.5]),b=rnd(-4,4),q=den(m);const x1=q*nz(1,3),x2=q*nz(-3,-1);const y1=m*x1+b,y2=m*x2+b;if(Math.abs(y1)>5||Math.abs(y2)>5)continue;
    return {kind:'num',heft:true,sol:b,q:`${HEFT_NOTE}Zeichne die Gerade durch ${P('A',x2,y2)} und ${P('B',x1,y1)}. An welcher Stelle schneidet sie die y-Achse? Gib den y-Wert an.`,
      hints:['Trage beide Punkte sauber ein. Lege das Lineal an und verlängere die Gerade über die Punkte hinaus.','Lies ab, wo deine Gerade die senkrechte y-Achse kreuzt.','Kontrolle ohne Zeichnung: Berechne m aus A und B und setze einen Punkt ein. Dann bekommst du denselben Wert.'],
      explain:`Die Gerade ${eqH(m,b)} schneidet die y-Achse bei (0|${dz(b)}).`,after:{lines:[{m,b,cls:'a'}],points:[{x:x2,y:y2,label:'A'},{x:x1,y:y1,label:'B'},{x:0,y:b,cls:'g'}]}};}
}};
G.bval={name:'y-Achsenabschnitt berechnen',make(){
  const {m,b}=niceLine(),q=den(m);let x;do{x=q*nz(-3,3);}while(Math.abs(x)>7);const y=m*x+b;
  return {kind:'num',sol:b,q:`Die Gerade ${'<span class="eq"><i>y</i> = '+fr(m)+X+' + <i>b</i></span>'} verläuft durch ${P('P',x,y)}. Berechne <i>b</i>.`,
    hints:['Setze die Koordinaten von P in die Gleichung ein.',`${dz(y)} = ${fr(m)} · ${par(x)} + <i>b</i>. Rechne das Produkt aus und bringe es auf die andere Seite.`,`${HB}: ${Yv} = 2${X} + <i>b</i> durch P(3|1): 1 = 6 + <i>b</i> ⇒ <i>b</i> = −5.`],
    explain:`${dz(y)} = ${dz(m*x)} + <i>b</i> ⇒ <i>b</i> = ${dz(b)}.`};
}};
/* ---- Etappe 5 ---- */
function zeroLine(){for(;;){const m=pick([-3,-2,-1,-0.5,0.5,1,2,3,1.5,-1.5]),x0=rnd(-5,5),b=-m*x0;if(isInt(2*b)&&b!==0&&Math.abs(b)<=9)return{m,b,x0};}}
G.zero={name:'Nullstelle berechnen',make(){
  const {m,b,x0}=zeroLine();
  return {kind:'num',sol:x0,q:`Berechne die Nullstelle der Funktion ${eqH(m,b,F)}.`,
    hints:['An der Nullstelle ist der Funktionswert 0. Setze also <i>f</i>(<i>x</i>) = 0.',`0 = ${term(m,b)}. Bringe ${dz(b)} auf die andere Seite und teile dann durch ${parF(m)}.`,`${HB}: <i>f</i>(${X}) = 2${X} − 6: 0 = 2${X} − 6 ⇒ 6 = 2${X} ⇒ ${X} = 3.`],
    explain:`0 = ${term(m,b)} ⇒ ${dz(-b)} = ${fr(m)}${X} ⇒ ${X} = ${dz(x0)}. Der Graph schneidet die x-Achse in (${dz(x0)}|0).`,after:{lines:[{m,b,cls:'a'}],points:[{x:x0,y:0,label:`N(${dz(x0)}|0)`}]}};
}};
G.zerograph={name:'Nullstelle ablesen',make(){
  for(;;){const {m,b,x0}=zeroLine();if(Math.abs(b)>5||Math.abs(x0)>5||x0===0)continue;
    return {kind:'num',sol:x0,plot:{lines:[{m,b,cls:'a'}]},after:{lines:[{m,b,cls:'a'}],points:[{x:x0,y:0,label:`N(${dz(x0)}|0)`}]},q:'Lies am Graphen ab: Wo liegt die Nullstelle der Funktion?',
      hints:['Die Nullstelle ist die Stelle, an der der Graph die x-Achse schneidet.','Suche den Schnittpunkt mit der waagerechten x-Achse. Gesucht ist nur sein x-Wert.',`${HB}: Kreuzt der Graph die x-Achse bei (−2|0), ist die Nullstelle ${X} = −2.`],
      explain:`Der Graph schneidet die x-Achse bei ${X} = ${dz(x0)}.`};}
}};
G.inter={name:'Schnittpunkt berechnen',make(){
  for(;;){const ms=[-3,-2,-1,-0.5,0.5,1,2,3],m1=pick(ms),m2=pick(ms);if(near(m1,m2))continue;const X0=nz(-4,4),Y0=rnd(-4,4);const b1=Y0-m1*X0,b2=Y0-m2*X0;if(!isInt(b1)||!isInt(b2)||Math.abs(b1)>9||Math.abs(b2)>9)continue;
    return {kind:'point',sol:[X0,Y0],q:`Berechne den Schnittpunkt S der Geraden ${eqH(m1,b1,'<i>f</i>(<i>x</i>)')} und ${eqH(m2,b2,'<i>g</i>(<i>x</i>)')}.`,

G.count={name:'Anzahl der Schnittpunkte',make(){
  const kind=pick([0,1,2]),m=pick([-3,-2,-1,1,2,3,0.5]),b=rnd(-4,4);
  let g2,txt;
  if(kind===0){let c;do{c=rnd(-5,5);}while(c===b);g2=eqH(m,c,'<i>g</i>(<i>x</i>)');txt='Gleiche Steigung, verschiedene y-Achsenabschnitte: Die Geraden sind parallel und schneiden sich nie.';}
  else if(kind===1){let m2;do{m2=pick([-3,-2,-1,1,2,3,0.5]);}while(m2===m);g2=eqH(m2,rnd(-4,4),'<i>g</i>(<i>x</i>)');txt='Verschiedene Steigungen: Die Geraden schneiden sich in genau einem Punkt.';}
  else {const k=pick([2,3]);const mm=m/k,bb=b/k;g2=`<span class="eq"><i>g</i>(<i>x</i>) = ${k} · (${term(mm,bb)})</span>`;txt=`Klammer ausmultipliziert ergibt sich dieselbe Gleichung wie bei <i>f</i>. Die Geraden liegen aufeinander.`;}

    hints:['Vergleiche die Steigungen der beiden Geraden. Löse vorher Klammern auf.','Verschiedene Steigungen: ein Schnittpunkt. Gleiche Steigung: Vergleiche zusätzlich b.',`${HB}: ${Yv} = 2${X} + 1 und ${Yv} = 2${X} − 3 haben dieselbe Steigung, aber verschiedene b-Werte.`],
    explain:txt});
}};

G.candle={name:'Kerze brennt ab',make(){
  for(;;){const L=pick([12,15,18,20,24,30]),r=pick([1.5,2,2.5,3]),T=L/r;if(!isInt(2*T))continue;const v=rnd(0,2);

      hints:[APPH,'Abgebrannt heißt: Die Höhe ist 0. Gesucht ist die Nullstelle von y = −'+dz(r)+'x + '+dz(L)+'.',`${HB}: 10 cm, 2 cm pro Stunde: 10 : 2 = 5 Stunden.`],explain:`0 = −${dz(r)}${X} + ${dz(L)} ⇒ ${X} = ${dz(T)} Stunden.`};

/* =========================================================
   Speicherstand und Code
   ========================================================= */
const ALPH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function freshState(){return {xp:0,streak:0,lastDay:-1,cur:2,lv:Array.from({length:6},()=>({t:0,key:false,exp:false,bonus:0,note:false,c:[]})),mock:{best:0,tries:0}};}
function dayNum(){const d=new Date();return Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(2026,0,1))/864e5);}
function payloadBits(st){
  const bits=[];const put=(v,n)=>{v=Math.max(0,Math.min(Math.round(v),(2**n)-1));for(let i=n-1;i>=0;i--)bits.push(Math.floor(v/2**i)%2);};
  put(2,3);put(st.cur,3);put(st.xp,17);put(st.streak,7);put(st.lastDay<0?0:(st.lastDay%32766)+1,15);
  st.lv.forEach(l=>{put(l.t,7);put(l.key?1:0,1);put(l.exp?1:0,1);put(l.bonus,3);});
  put(st.mock.best,7);put(st.mock.tries,5);
  return bits;
}
function chk(bits){let cs=0;for(let i=0;i<bits.length;i+=8){let by=0;for(let j=0;j<8;j++)by=(by<<1)|(bits[i+j]||0);cs=(cs*31+by+7)&255;}return cs;}
function stream(n){const out=[];let s=0x5A17C3;for(let i=0;i<n;i++){s=(Math.imul(s,1103515245)+12345)&0x7fffffff;out.push((s>>16)&1);}return out;}
function encodeLong(st){
  const bits=payloadBits(st);const cs=chk(bits);for(let i=7;i>=0;i--)bits.push((cs>>i)&1);
  while(bits.length%5)bits.push(0);
  const ks=stream(bits.length);for(let i=0;i<bits.length;i++)bits[i]^=ks[i];
  let out='';for(let i=0;i<bits.length;i+=5){let v=0;for(let j=0;j<5;j++)v=(v<<1)|bits[i+j];out+=ALPH[v];}
  return out.match(/.{1,4}/g).join('-');
}
function decodeLong(code){
  const s=String(code).toUpperCase().replace(/[^A-Z0-9]/g,'');
  const ver=s.length===28?2:s.length===24?1:0;if(!ver) return null;
  const bits=[];for(const ch of s){const v=ALPH.indexOf(ch);if(v<0)return null;for(let i=4;i>=0;i--)bits.push((v>>i)&1);}
  const ks=stream(bits.length);for(let i=0;i<bits.length;i++)bits[i]^=ks[i];
  let pos=0;const get=n=>{let v=0;for(let i=0;i<n;i++)v=v*2+bits[pos++];return v;};
  const N=ver===2?129:111;const pay=bits.slice(0,N);let cs=0;for(let i=N;i<N+8;i++)cs=(cs<<1)|bits[i];
  if(chk(pay)!==cs) return null;
  if(get(3)!==ver) return null;
  const st=freshState();st.cur=Math.min(get(3),6);st.xp=get(17);st.streak=get(7);const ld=get(15);st.lastDay=ld===0?-1:ld-1;
  st.lv.forEach(l=>{if(ver===2)l.t=get(7);else get(4);l.key=!!get(1);l.exp=!!get(1);l.bonus=get(3);if(ver===1&&l.key)l.t=127;});
  st.mock.best=Math.min(get(7),100);st.mock.tries=get(5);
  return st;
}

/* ---- Kurzer Speichercode: 6 Zeichen (30 Bit) ----
   gespeichert: Schlüssel der Etappen 3 bis 6, gelöste Aufgabentypen der aktuellen Etappe,
   Höhenmeter (auf 50 gerundet), Bestwert der Probearbeit, Tage-Serie. Prüfsumme 4 Bit. */
const PROG=[7,6,5,7], POFF=[0,128,192,224,352];
const M30=1n<<30n, KA=0x2F3A5B7n, KX=0x15A3C6Dn;
const KAI=(()=>{let x=1n;for(let i=0;i<6;i++)x=((x*(2n-KA*x))%M30+M30)%M30;return x;})();
function cs4(p){let h=Math.imul(p^0x5bd1e995,0x27d4eb2d);h^=h>>>15;h=Math.imul(h,0x85ebca6b);h^=h>>>13;return (h>>>28)&15;}
function encode(st){
  let p=0;while(p<4&&st.lv[2+p].key)p++;
  const prog=p===4?352:POFF[p]+(st.lv[2+p].t&((1<<PROG[p])-1));
  const xp=Math.min(127,Math.round(st.xp/50));
  const mk=st.mock.tries?Math.min(11,Math.floor(st.mock.best/10)+1):0;
  const live=st.lastDay>=0&&st.lastDay>=dayNum()-1;
  const sk=live?Math.min(st.streak,15):0, dd=st.lastDay<0?0:((st.lastDay%4)+4)%4;
  const pay=prog*131072+xp*1024+mk*64+sk*4+dd;
  let v=BigInt(pay*16+cs4(pay));v=((v^KX)*KA)%M30;
  let out='';for(let i=0;i<6;i++){out=ALPH[Number(v&31n)]+out;v>>=5n;}
  return out.slice(0,3)+'-'+out.slice(3);
}
function decodeShort(s){
  let v=0n;for(const ch of s){const k=ALPH.indexOf(ch);if(k<0)return null;v=v*32n+BigInt(k);}
  v=((v*KAI)%M30)^KX;const pay=Number(v>>4n);if(cs4(pay)!==Number(v&15n))return null;
  const prog=Math.floor(pay/131072),xp=Math.floor(pay/1024)%128,mk=Math.floor(pay/64)%16,sk=Math.floor(pay/4)%16,dd=pay%4;
  if(prog>352||mk>11)return null;
  let p=0;while(p<4&&prog>=POFF[p+1])p++;
  const st=freshState();
  for(let k=0;k<p;k++){const l=st.lv[2+k];l.key=true;l.t=(1<<PROG[k])-1;l.exp=true;l.note=true;}
  if(p<4)st.lv[2+p].t=prog-POFF[p];
  st.cur=p===4?6:2+p;st.xp=xp*50;
  if(mk){st.mock.tries=1;st.mock.best=(mk-1)*10;}
  if(sk){const d=dayNum();let L=d;while(((L%4)+4)%4!==dd)L--;st.lastDay=L;st.streak=sk;}
  return st;
}
function decode(code){
  const s=String(code).toUpperCase().replace(/[^A-Z0-9]/g,'');
  return s.length===6?decodeShort(s):decodeLong(s);
}

/* =========================================================
   Prüfen von Antworten
   ========================================================= */
function check(t,v){
  if(t.check) return t.check(v);
  switch(t.kind){
    case 'num':{const n=parseNum(v);if(isNaN(n))return{invalid:true,msg:'Gib eine Zahl ein, zum Beispiel 3, −2,5 oder 3/4.'};const tol=t.tol??1e-6;
      if(near(n,t.sol,tol))return{ok:true};if(!near(t.sol,0)&&near(n,-t.sol,tol))return{ok:false,msg:'Fast: Prüfe das Vorzeichen.'};return{ok:false};}
    case 'eq':{let s=String(v||'');if(!s.trim())return{invalid:true,msg:'Trage eine Gleichung ein.'};if(!s.includes('='))s='y='+s;const L=parseLinear(s);
      if(!L)return{invalid:true,msg:'Das kann ich nicht lesen. Schreibe zum Beispiel 2x − 3 oder 1/2x + 4.'};
      if(L.nonlinear)return{ok:false,msg:'Das ist keine Gleichung der Form y = mx + b.'};
      const mo=near(L.m,t.sol.m,1e-6),bo=near(L.b,t.sol.b,1e-6);if(mo&&bo)return{ok:true};
      if(mo)return{ok:false,msg:'Die Steigung m stimmt. Prüfe noch b.'};if(bo)return{ok:false,msg:'b stimmt. Prüfe noch die Steigung m.'};return{ok:false};}
    case 'point':{const a=parseNum(v[0]),b=parseNum(v[1]);if(isNaN(a)||isNaN(b))return{invalid:true,msg:'Trage beide Koordinaten ein.'};
      if(near(a,t.sol[0])&&near(b,t.sol[1]))return{ok:true};if(near(a,t.sol[1])&&near(b,t.sol[0]))return{ok:false,msg:'Hast du x und y vertauscht?'};
      if(near(a,t.sol[0]))return{ok:false,msg:'Die x-Koordinate stimmt. Prüfe y.'};return{ok:false};}
    case 'table':{const ns=v.map(parseNum);if(ns.some(isNaN))return{invalid:true,msg:'Fülle alle Felder mit Zahlen aus.'};const k=ns.filter((n,i)=>near(n,t.sol[i])).length;
      return k===ns.length?{ok:true}:{ok:false,msg:`${k} von ${ns.length} Werten stimmen.`};}
    case 'choice':if(v==null)return{invalid:true,msg:'Wähle eine Antwort aus.'};return{ok:v===t.sol};
    case 'slider':return{ok:Object.keys(t.sol).every(k=>near(v[k],t.sol[k],1e-6))};
  }
  return {ok:false};
}

function mapSVG(interactive){
  const W=800,H=380,mx=x=>58+x/13*(W-82),my=h=>H-42-(h-400)/(3200-400)*(H-74);
  let s=`<svg class="map" viewBox="0 0 ${W} ${H}" role="img" aria-label="Bergroute mit sieben Etappen">`;
  for(let h=500;h<=3000;h+=500)s+=`<path class="mgrid" d="M${mx(0)} ${my(h)}H${mx(13)}"/><text x="${mx(0)-8}" y="${my(h)+4}" text-anchor="end">${h}</text>`;
  for(let x=0;x<=13;x++)s+=`<text x="${mx(x)}" y="${H-24}" text-anchor="middle">${x}</text>`;
  s+=`<text x="${mx(13)}" y="${H-8}" text-anchor="end">Strecke in km</text><text x="${mx(0)-46}" y="${my(3150)}">Höhe in m</text>`;
  const ridge=[[0,1300],[1.6,1800],[3.2,1450],[5.2,2350],[7,1950],[9,2750],[11,2350],[13,2050]];
  s+=`<path class="ridge" d="M${mx(0)} ${my(400)}${ridge.map(([x,h])=>`L${mx(x)} ${my(h)}`).join('')}L${mx(13)} ${my(400)}Z"/>`;
  const sil=[[0,560],...ST.map(p=>[p.x,p.h]),[13,2780]];
  s+=`<path class="mount" d="M${mx(0)} ${my(400)}${sil.map(([x,h])=>`L${mx(x)} ${my(h)}`).join('')}L${mx(13)} ${my(400)}Z"/>`;
  s+=`<path class="snow" d="M${mx(11.55)} ${my(2810)}L${mx(12.5)} ${my(3000)}L${mx(13)} ${my(2780)}L${mx(13)} ${my(2730)}L${mx(12.7)} ${my(2800)}L${mx(12.35)} ${my(2740)}L${mx(12)} ${my(2820)}L${mx(11.75)} ${my(2770)}Z"/>`;
  s+=`<path class="maxis" d="M${mx(0)} ${my(400)}H${mx(13)+6}M${mx(0)} ${my(400)}V${my(3200)}"/>`;
  for(let i=0;i<6;i++){const a=ST[i],b=ST[i+1],done=S.lv[i].key;const d=`M${mx(a.x)} ${my(a.h)}L${mx(b.x)} ${my(b.h)}`;
    s+=`<path class="seg ${done?'done':''}" d="${d}"/>${done?`<path class="seg-w" d="${d}"/>`:''}`;
    const sl=(b.h-a.h)/(b.x-a.x);s+=`<text class="slope" x="${mx((a.x+b.x)/2)-14}" y="${my((a.h+b.h)/2)-16}" text-anchor="middle">+${dz(sl)} m/km</text>`;}
  ST.forEach((p,i)=>{
    const open=i<6?unlocked(i):unlocked(6), done=i<6?S.lv[i].key:S.mock.best>=80;
    const st=done?'done':open?'open':'locked';const icn=done?(i===6?'flag':'key'):open?(i===6?'flag':'door'):'lock';
    const cx=mx(p.x),cy=my(p.h);const lab=`Etappe ${i+1}: ${LEVELS[i].title}${open?'':' (verschlossen)'}`;
    s+=`<g class="st ${st} ${interactive&&open?'click':''}" data-lv="${i}" ${interactive&&open?`tabindex="0" role="button"`:''} aria-label="${lab}"><title>${lab}</title>`;
    if(interactive&&i===S.cur&&open)s+=`<circle class="here" cx="${cx}" cy="${cy}" r="22"/>`;
    s+=`<circle class="base" cx="${cx}" cy="${cy}" r="18"/><g class="sic" transform="translate(${cx-9} ${cy-9}) scale(.75)">${ICON[icn]}</g>`;
    s+=`<text class="num" x="${cx}" y="${cy+36}" text-anchor="middle">${i===6?'Gipfel':i+1}</text></g>`;
  });
  return s+'</svg>';
}
function wireMap(root){$$('.st.click',root).forEach(g=>{const f=()=>go('level',+g.dataset.lv);g.addEventListener('click',f);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();f();}});});}

     <div class="rank"><div style="display:flex;justify-content:space-between;gap:10px"><b>${r[1]}</b><span class="muted">${n?`noch ${n[0]-S.xp} hm bis ${n[1]}`:'höchster Rang'}</span></div><div class="bar"><span style="width:${pct}%"></span></div></div>

     const meta=i<6?`Aufgabentypen ${nDone(i)}/${nReq(i)} · Kristalle ${[0,1,2].filter(b=>l.bonus&(1<<b)).length}/3${l.exp?' · entdeckt':''}${l.note?' · Merksatz':''}`:`${S.mock.tries} Probearbeit${S.mock.tries===1?'':'en'} geschrieben`;

/* ---------- Etappe ---------- */
const TABS=[['entdecken','Entdecken','compass'],['ueben','Üben','pencil'],['schluessel','Schlüsselprüfung','key'],['bonus','Kristalle','gem']];
function levelChips(i){const l=S.lv[i];return `<span class="chip ${l.exp?'ok':''}">${ic('compass')}${l.exp?'entdeckt':'entdecken'}</span><span class="chip ${nDone(i)>=nReq(i)?'ok':''}">${ic('pencil')}${nDone(i)}/${nReq(i)} Typen gemeistert</span><span class="chip ${l.key?'done':''}">${ic('key')}${l.key?'Schlüssel':'kein Schlüssel'}</span><span class="chip ${l.note?'ok':''}">${ic('book')}${l.note?'Merksatz im Heft':'Merksatz offen'}</span><span class="chip">${ic('gem')}${[0,1,2].filter(b=>l.bonus&(1<<b)).length}/3</span>`;}
function refreshChips(i){const c=$('#lvchips');if(c)c.innerHTML=levelChips(i);}
function renderLevel(main,i){
  if(!unlocked(i)){go('map');return;}
  const L=LEVELS[i];
  if(i===6){renderSummit(main);return;}
  main.innerHTML=`<section class="wrap">
   <button class="back" id="back">← Zur Route</button>
   <div class="lvl-head"><div><p class="eyebrow">Etappe ${i+1} von 6</p><h1>${L.title}</h1><p class="lead">${L.sub}</p></div><div class="lvl-chips" id="lvchips">${levelChips(i)}</div></div>
   <div class="tabs" role="tablist">${TABS.map(([k,t,icn])=>`<button class="tab" role="tab" data-t="${k}" aria-selected="${view.tab===k}">${ic(icn)}${t}</button>`).join('')}</div>

function showTab(i){const p=$('#panel');({entdecken:panelExplore,ueben:panelPractice,schluessel:panelKey,bonus:panelBonus})[view.tab](p,i);}

/* ---------- Aufgaben-Renderer ---------- */
let UID=0;
function renderTask(host,t,o){
  const id='t'+(++UID),mode=o.mode,canHint=(mode==='practice'||mode==='explore'||mode==='bonus');
  const hints=canHint?(t.hints||[]).slice(0,o.maxHints??3):[];
  let used=0,solved=false,wrong=0,choice=null;const vals={};
  if(t.kind==='slider')t.sliders.forEach(s=>vals[s.k]=s.init);
  let opts=null;
  if(t.kind==='choice'){const idx=t.options.map((_,k)=>k);opts=t.noShuffle?idx:shuffle(idx);}
  let inp='';
  switch(t.kind){
    case 'num':inp=`<div class="ans"><label for="${id}-n">Antwort</label><input id="${id}-n" class="inp" autocomplete="off" spellcheck="false">${t.unit?`<span class="unit">${t.unit}</span>`:''}</div>`;break;
    case 'eq':inp=`<div class="ans"><label for="${id}-n">Funktionsgleichung</label><span class="eqwrap"><span><i>y</i> =</span><input id="${id}-n" class="inp wide" placeholder="z. B. 2x − 3" autocomplete="off" spellcheck="false"></span></div><p class="fmt">Brüche so: 2/3x. Dezimalzahlen mit Komma: 0,5x + 1.</p>`;break;
    case 'point':inp=`<div class="ans"><span class="eqwrap">(<label class="muted" for="${id}-x">x</label><input id="${id}-x" class="inp sm" autocomplete="off"> | <label class="muted" for="${id}-y">y</label><input id="${id}-y" class="inp sm" autocomplete="off">)</span></div>`;break;
    case 'table':inp=`<div class="tbl-scroll"><table class="vt"><tr><th>x</th>${t.xs.map(x=>`<td>${dz(x)}</td>`).join('')}</tr><tr><th>y</th>${t.xs.map((x,k)=>`<td><input id="${id}-c${k}" class="inp" aria-label="y-Wert für x = ${dz(x)}" autocomplete="off"></td>`).join('')}</tr></table></div>`;break;
    case 'choice':inp=`<div class="choices" role="radiogroup">${opts.map(k=>`<button type="button" class="choice" role="radio" aria-checked="false" data-k="${k}">${t.options[k]}</button>`).join('')}</div>`;break;
    case 'slider':inp=t.sliders.map(s=>`<div class="sl"><label for="${id}-s${s.k}"><span><i>${s.k}</i></span><output id="${id}-o${s.k}">${dz(s.init)}</output></label><input type="range" id="${id}-s${s.k}" min="${s.min}" max="${s.max}" step="${s.step}" value="${s.init}"></div>`).join('');break;
  }
  const plotCfg=t.kind==='slider'?t.live(vals):t.plot;
  host.innerHTML=`<div class="task ${plotCfg?'has-plot':''}">
   <div class="task-body"><div class="task-q">${t.q}</div>${plotCfg?`<div class="task-plot" id="${id}-p">${plotSVG(plotCfg)}</div>`:''}</div>
   <form id="${id}-f" novalidate>${inp}<div class="row-actions"><button class="btn" id="${id}-go">${mode==='key'||mode==='mock'?'Antwort abgeben':'Prüfen'}</button>${hints.length?`<button type="button" class="btn ghost" id="${id}-h">${ic('bulb')}Hilfe <span id="${id}-hc">1 von ${hints.length}</span></button>`:''}</div></form>
   <div class="fb" id="${id}-fb" role="status"></div>
   <div class="hints" id="${id}-hs"></div>
   <div class="after" id="${id}-a" hidden></div>
  </div>`;
  const root=host.firstElementChild,fb=$('#'+id+'-fb'),form=$('#'+id+'-f');
  const say=(cls,msg)=>{fb.className='fb show '+cls;fb.innerHTML=msg;};
  if(t.kind==='choice')$$('.choice',root).forEach(b=>b.onclick=()=>{if(solved)return;choice=+b.dataset.k;$$('.choice',root).forEach(x=>x.setAttribute('aria-checked',x===b));});
  if(t.kind==='slider')t.sliders.forEach(s=>{const r=$('#'+id+'-s'+s.k);r.oninput=()=>{vals[s.k]=parseFloat(r.value);$('#'+id+'-o'+s.k).textContent=dz(vals[s.k]);$('#'+id+'-p').innerHTML=plotSVG(t.live(vals));};});
  if(hints.length)$('#'+id+'-h').onclick=()=>{if(used>=hints.length)return;const lab=used===hints.length-1&&hints.length===3?'Beispiel':'Tipp '+(used+1);
    const d=document.createElement('div');d.className='hint';d.innerHTML=`<b>${lab}</b><span>${hints[used]}</span>`;$('#'+id+'-hs').appendChild(d);used++;
    if(used>=hints.length){$('#'+id+'-h').disabled=true;$('#'+id+'-hc').textContent='alle gezeigt';}else $('#'+id+'-hc').textContent=`${used+1} von ${hints.length}`;
    if(session.combo){session.combo=0;renderHUD();}o.onHint&&o.onHint();};
  const getVal=()=>{switch(t.kind){case 'num':case 'eq':return $('#'+id+'-n').value;case 'point':return[$('#'+id+'-x').value,$('#'+id+'-y').value];
    case 'table':return t.xs.map((_,k)=>$('#'+id+'-c'+k).value);case 'choice':return choice;case 'slider':return Object.assign({},vals);}};
  const lock=()=>{$$('input,button.choice',form).forEach(e=>e.disabled=true);$('#'+id+'-go').disabled=true;if(hints.length)$('#'+id+'-h').disabled=true;};
  form.onsubmit=e=>{e.preventDefault();if(solved)return;const r=check(t,getVal());
    if(r.invalid){say('info',r.msg);return;}
    if(mode==='key'||mode==='mock'){solved=true;lock();o.onAnswer&&o.onAnswer(!!r.ok);return;}
    if(r.ok){solved=true;lock();say('ok',`${ic('check')} Richtig!${used?'':' Ganz ohne Hilfe.'}`);
      const a=$('#'+id+'-a');a.hidden=false;a.innerHTML=`<p><b>So geht es:</b> ${t.explain||''}</p>${t.after?plotSVG(t.after):''}${o.onNext?`<div class="row-actions"><button class="btn" id="${id}-nx">${o.nextLabel||'Nächste Aufgabe'}</button></div>`:''}`;
      if(o.onNext)$('#'+id+'-nx').onclick=o.onNext;
      o.onSolved&&o.onSolved(used,wrong);
    }else{wrong++;session.combo=0;renderHUD();o.onWrong&&o.onWrong();root.classList.remove('shake');void root.offsetWidth;root.classList.add('shake');
      say('no',(r.msg?r.msg+' ':'Noch nicht richtig. ')+(wrong>=2&&used<hints.length?'Nutze die Hilfe.':'Versuch es noch einmal.'));}
  };
  const first=$('input:not([type=range])',root);if(first&&o.focus)first.focus({preventScroll:true});
}

/* ---------- Üben ---------- */
function panelPractice(p,i){
  const L=LEVELS[i];let sel=pendingType&&L.pool.includes(pendingType)?pendingType:'mix',last=null;pendingType=null;
  p.innerHTML=`<div class="pr-top"><div class="meter" id="pr-meter"></div><label>Aufgabentyp<select id="pr-sel"></select></label></div><div id="pr-task"></div><div class="row-actions" style="margin-top:12px"><button class="btn ghost sm" id="pr-skip">Andere Aufgabe</button></div>`;
  const meter=()=>{const l=S.lv[i],d=nDone(i),n=nReq(i);
    $('#pr-sel').innerHTML=`<option value="mix">Gemischt${d<n?' (offene Typen zuerst)':''}</option>`+L.pool.map((k,j)=>`<option value="${k}" ${sel===k?'selected':''}>${typeDone(i,j)?'✓ ':'○ '}${G[k].name} (${runOf(i,j)}/${NROW})</option>`).join('');
    $('#pr-meter').innerHTML=(l.key?`<b>Schlüssel erhalten.</b><span class="muted">Weiter üben bringt Höhenmeter und hält deine Serie.</span>`:
      `<div style="display:flex;justify-content:space-between;gap:8px"><b>Bis zur Schlüsselprüfung</b><span class="muted">${d} / ${n} Aufgabentypen gemeistert</span></div><div class="bar gold"><span style="width:${d/n*100}%"></span></div><span class="muted">Löse jeden Aufgabentyp <b>${NROW}-mal hintereinander richtig</b>, ohne Fehlversuch und ohne Hilfe. Ein Fehler oder eine Hilfe startet die Serie dieses Typs neu.</span>`)
      +`<div class="types">${L.pool.map((k,j)=>`<button type="button" class="chip ${typeDone(i,j)?'ok':''}" data-ty="${k}" title="Diesen Typ üben">${typeDone(i,j)?ic('check'):''}${G[k].name} · ${runOf(i,j)}/${NROW}</button>`).join('')}</div>`
      +(session.cool[i]?`<span class="muted">Noch ${session.cool[i]} Übung${session.cool[i]>1?'en':''}, dann darfst du die Prüfung wiederholen.</span>`:'');
    $$('[data-ty]',p).forEach(b=>b.onclick=()=>{sel=b.dataset.ty;meter();next();});};
  const heftMoment=(fresh,name)=>{session.solved=(session.solved||0)+1;if(!fresh&&session.solved%3)return;
    const a=$('#pr-task .after');if(!a)return;const d=document.createElement('div');d.className='heft note';const hm=fresh?15:5;
    d.innerHTML=`${ic('book')}<span>${fresh?`<b>Neuer Aufgabentyp, neue Musteraufgabe:</b> Schreibe „${name}“ als Überschrift in dein Heft, darunter Aufgabe, Rechenweg und Antwort. Notiere daneben in einem Satz, worauf du achten musst.`:'<b>Heft-Moment:</b> Übertrage diese Aufgabe mit Rechenweg in dein Heft. So siehst du später, wie du sie gelöst hast.'}</span><button class="btn gold sm">Steht im Heft · +${hm} hm</button>`;
    a.insertBefore(d,a.querySelector('.row-actions'));
    const b=$('button',d);b.onclick=()=>{b.disabled=true;b.textContent='Notiert';award(hm,fresh?'Musteraufgabe im Heft':'Heft-Eintrag');};};
  const next=()=>{let k=sel;
    if(sel==='mix'){const open=L.pool.filter((x,j)=>!typeDone(i,j)&&x!==last);k=pick(open.length?open:L.pool.filter(x=>x!==last));}
    last=k;const j=L.pool.indexOf(k);
    let broke=false;const brk=()=>{if(broke)return;broke=true;if(resetRun(i,j)){meter();toast(`0/${NROW}`,`Serie für „${G[k].name}“ startet neu`);}};
    renderTask($('#pr-task'),G[k].make(),{mode:'practice',focus:false,onNext:next,onWrong:brk,onHint:brk,onSolved:(used,wrong)=>{
      const l=S.lv[i],was=ready(i),pre=typeDone(i,j);l.c=l.c||[];
      if(!pre&&!used&&!wrong)l.c[j]=(l.c[j]||0)+1;
      const fresh=!pre&&l.c[j]>=NROW;if(fresh)l.t|=(1<<j);if(session.cool[i])session.cool[i]--;
      session.seen=session.seen||{};const first=!session.seen[k]&&!pre;session.seen[k]=1;
      if(!used){session.combo++;}else session.combo=0;
      const bonus=used?0:Math.min(Math.max(session.combo-1,0),5)*5;
      award(Math.max(30-8*used,10)+bonus+(fresh?20:0),fresh?`Gemeistert: ${G[k].name}, ${NROW} richtig in Folge`:(!pre&&!used&&!wrong)?`${G[k].name}: ${l.c[j]}/${NROW} in Folge`:used?'Aufgabe gelöst':session.combo>=2?`${session.combo} richtig in Folge`:'ohne Hilfe gelöst');
      meter();refreshChips(i);heftMoment(first,G[k].name);
      if(!was&&ready(i))toast(ic('key'),'Alle Aufgabentypen gemeistert. Die Schlüsselprüfung ist jetzt frei.');}});};
  $('#pr-sel').onchange=e=>{sel=e.target.value;meter();next();};
  $('#pr-skip').onclick=next;
  meter();next();
}

/* ---------- Schlüsselprüfung ---------- */
function panelKey(p,i){
  const l=S.lv[i],L=LEVELS[i];
  if(!ready(i)){const miss=L.pool.filter((k,j)=>!typeDone(i,j));
    p.innerHTML=`<div class="gate"><h2>${ic('lock')} Noch verschlossen</h2><p>Bevor du die Schlüsselprüfung schreiben darfst, löst du <b>jeden Aufgabentyp ${NROW}-mal hintereinander richtig</b>, ohne Fehlversuch und ohne Hilfe. Gemeistert: ${nDone(i)} von ${nReq(i)}.</p><div class="bar gold"><span style="width:${nDone(i)/nReq(i)*100}%"></span></div>

    $$('[data-mk]',p).forEach(b=>b.onclick=()=>{pendingType=b.dataset.mk;$('.tab[data-t="ueben"]').click();});return;}
  if(session.cool[i]){p.innerHTML=`<div class="gate"><h2>Kurze Pause vom Tor</h2><p>Übe noch ${session.cool[i]} Aufgabe${session.cool[i]>1?'n':''}. Dann kannst du die Prüfung wiederholen.</p><div class="row-actions"><button class="btn" id="k-tr">Zum Üben</button></div></div>`;$('#k-tr').onclick=()=>$('.tab[data-t="ueben"]').click();return;}
  p.innerHTML=`<div class="gate"><h2>${ic('key')} Schlüsselprüfung · Etappe ${i+1}</h2>
    <p>${l.key?'Du hast den Schlüssel schon. Du kannst die Prüfung trotzdem zum Trainieren schreiben.':`Du bekommst ${KEYN} Aufgaben auf Anwendungsniveau. <b>Ohne Hilfen, ein Versuch pro Aufgabe.</b> Mit ${KEYPASS} richtigen Antworten öffnet sich die Tür zu Etappe ${i+2}.`}</p>
    <p class="muted">Tipp: Nimm dir Heft und Stift. Rechne jede Aufgabe sauber auf.</p>
    <div class="row-actions"><button class="btn gold" id="k-go">Prüfung starten</button></div></div>`;

    const ks=L.key||shuffle(L.pool).slice(0,KEYN);const tasks=ks.map(k=>({k,t:G[k].make()}));const res=[];

      if(res.length===tasks.length)return finish();
      const n=res.length;
      p.innerHTML=`<div class="gate wide"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><b>Aufgabe ${n+1} von ${tasks.length}</b><div class="dots">${tasks.map((_,j)=>`<span class="dot ${j<n?'d':j===n?'cur':''}">${j+1}</span>`).join('')}</div></div><div id="k-task"></div></div>`;
      renderTask($('#k-task'),tasks[n].t,{mode:'key',focus:true,onAnswer:ok=>{res.push(ok);setTimeout(step,250);}});
    };
    const finish=()=>{
      const c=res.filter(Boolean).length,pass=c>=KEYPASS,first=pass&&!l.key;
      p.innerHTML=`<div class="gate"><p class="eyebrow">Ergebnis</p><div class="score">${c} / ${tasks.length}</div>
        <h2>${pass?(first?'Bestanden! Der Schlüssel gehört dir.':'Bestanden!'):'Diesmal noch nicht.'}</h2>
        <ul class="res-list">${tasks.map((x,j)=>`<li class="${res[j]?'':'n'}">${ic(res[j]?'check':'x')}<span>${G[x.k].name}</span></li>`).join('')}</ul>
        <p class="muted">${pass?'':'Schau dir im Heft deine Musteraufgaben zu den Typen mit dem Kreuz an und übe sie gezielt. Unter „Üben“ kannst du sie einzeln auswählen. Nach 2 weiteren Übungen darfst du es noch einmal versuchen.'}</p>
        <div class="row-actions">${pass&&i<5?`<button class="btn" id="k-next">Weiter zu Etappe ${i+2}</button>`:''}${pass&&i===5?`<button class="btn" id="k-next">Zum Gipfel</button>`:''}${!pass?'<button class="btn" id="k-tr">Gezielt üben</button>':''}<button class="btn ghost" id="k-map">Zur Route</button></div></div>`;
      if(pass){if(first){l.key=true;save();award(100,'Schlüsselprüfung bestanden');refreshChips(i);doorModal(i);}else award(20,'Prüfung erneut bestanden');}
      else{session.cool[i]=2;}
      const nx=$('#k-next');if(nx)nx.onclick=()=>go('level',i+1,'entdecken');
      const tr=$('#k-tr');if(tr)tr.onclick=()=>$('.tab[data-t="ueben"]').click();
      $('#k-map').onclick=()=>go('map');
    };
    step();
  };
}

 },
 function(h){
