/* ---------- Gipfel: Probearbeit ---------- */
function renderSummit(main){
  main.innerHTML=`<section class="wrap"><button class="back" id="back">← Zur Route</button>
   <div class="lvl-head"><div><p class="eyebrow">Gipfel</p><h1>Probearbeiten</h1><p class="lead">${LEVELS[6].sub}</p></div><div class="lvl-chips"><span class="chip ${S.mock.best>=80?'done':''}">${ic('flag')}Bestwert ${S.mock.best} %</span><span class="chip">${S.mock.tries} geschrieben</span></div></div>
   <div id="panel"></div></section>`;
  $('#back').onclick=()=>go('map');
  const p=$('#panel');
  const intro=()=>{p.innerHTML=`<div class="gate"><h2>So läuft die Probearbeit</h2><ul style="margin:0;padding-left:1.2em;display:grid;gap:6px"><li>10 Aufgaben aus allen Etappen, jedes Mal neu zusammengestellt.</li><li>Keine Hilfen, ein Versuch pro Aufgabe, wie in der Leistungsüberprüfung.</li><li>Eine Aufgabe zeichnest du im Heft. Lege Heft, Lineal und Stift bereit.</li><li>Plane etwa 30 Minuten ein. Am Ende siehst du, welche Etappen du wiederholen solltest.</li><li>Ab 80 % hisst du die Gipfelfahne.</li></ul><div class="row-actions"><button class="btn gold" id="m-go">Probearbeit starten</button></div></div>`;$('#m-go').onclick=run;};
  const run=()=>{
    const apps=shuffle(LEVELS[5].pool).slice(0,2);
    const ks=['fval','probe2','mgraph','eqgraph','twop','heft','zero','inter',...apps];
    const tasks=ks.map(k=>({k,t:G[k].make()}));const res=[];
    const step=()=>{if(res.length===tasks.length)return fin();const n=res.length;
      p.innerHTML=`<div class="gate wide"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><b>Aufgabe ${n+1} von ${tasks.length}</b><div class="dots">${tasks.map((_,j)=>`<span class="dot ${j<n?'d':j===n?'cur':''}">${j+1}</span>`).join('')}</div></div><div id="m-task"></div><div class="row-actions"><button class="btn ghost sm" id="m-skip">Überspringen</button></div></div>`;
      renderTask($('#m-task'),tasks[n].t,{mode:'mock',focus:true,onAnswer:ok=>{res.push(ok);setTimeout(step,250);}});
      $('#m-skip').onclick=()=>{res.push(false);step();};};
    const fin=()=>{const c=res.filter(Boolean).length,pct=Math.round(c/tasks.length*100);
      const grade=pct>=87?1:pct>=73?2:pct>=59?3:pct>=45?4:pct>=18?5:6;
      const first=S.mock.best<80&&pct>=80;S.mock.tries=Math.min(S.mock.tries+1,31);S.mock.best=Math.max(S.mock.best,pct);save();
      const weak=[...new Set(tasks.filter((_,j)=>!res[j]).map(x=>G[x.k].lv))].sort();
      p.innerHTML=`<div class="gate"><p class="eyebrow">Ergebnis</p><div style="display:flex;gap:24px;align-items:end;flex-wrap:wrap"><div class="score">${pct} %</div><div><b>${c} von ${tasks.length} Aufgaben richtig</b><p class="muted">Notentendenz: ${grade} (grober Richtwert)</p></div></div>
        <ul class="res-list">${tasks.map((x,j)=>`<li class="${res[j]?'':'n'}">${ic(res[j]?'check':'x')}<span>${G[x.k].name}</span><span class="muted">Etappe ${G[x.k].lv+1}</span>${res[j]?'':`<button class="btn soft sm go" data-l="${G[x.k].lv}" data-k="${x.k}">Üben</button>`}</li>`).join('')}</ul>
        <p>${weak.length?`Wiederhole vor allem ${weak.map(w=>'Etappe '+(w+1)).join(', ')}. Lies dazu zuerst deine Merksätze und Musteraufgaben im Heft.`:'Stark! Du bist bereit für die Leistungsüberprüfung.'}</p>
        <div class="row-actions"><button class="btn gold" id="m-again">Neue Probearbeit</button><button class="btn ghost" id="m-map">Zur Route</button></div></div>`;
      award(10*c+20,'Probearbeit geschrieben');if(first)setTimeout(()=>toast(ic('flag'),'Gipfelfahne gehisst!'),600);
      $$('.go',p).forEach(b=>b.onclick=()=>go('level',+b.dataset.l,'ueben'));
      $('#m-again').onclick=run;$('#m-map').onclick=()=>go('map');};
    step();};
  intro();
}

/* ---------- Modals ---------- */
function modal(html){const r=$('#modal-root');r.innerHTML=`<div class="overlay" id="ov"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  const close=()=>{r.innerHTML='';document.removeEventListener('keydown',esc);};const esc=e=>{if(e.key==='Escape')close();};document.addEventListener('keydown',esc);
  $('#ov').addEventListener('click',e=>{if(e.target.id==='ov')close();});return close;}
function codeModal(ending){
  const code=encode(S);
  const close=modal(`<p class="eyebrow">Dein Speichercode</p><h2>${ending?'Gut gemacht für heute!':'Stand gespeichert'}</h2>
    <p>Schreibe diesen Code in dein Heft. Beim nächsten Mal gibst du ihn auf der Startseite ein und machst genau hier weiter.</p>
    <div class="codebox" id="cd">${code}</div>
    <div class="row-actions"><button class="btn soft" id="cd-copy">${ic('copy')}Kopieren</button><span class="muted" id="cd-m"></span></div>
    <p class="muted" style="font-size:.88rem">Der Code speichert deine Schlüssel, die gelösten Aufgabentypen deiner aktuellen Etappe, deine Höhenmeter (auf 50 gerundet), deinen Bestwert und deine Serie. Kristalle bleiben nur auf diesem Gerät. Deine Merksätze stehen sowieso in deinem Heft.</p>
    <div class="row-actions">${ending?'<button class="btn" id="cd-end">Code notiert, Sitzung beenden</button><button class="btn ghost" id="cd-x">Weiterlernen</button>':'<button class="btn" id="cd-x">Weiterlernen</button>'}</div>`);
  $('#cd-copy').onclick=()=>{const ok=()=>$('#cd-m').textContent='Kopiert.';const fail=()=>{const r=document.createRange();r.selectNodeContents($('#cd'));const s=getSelection();s.removeAllRanges();s.addRange(r);$('#cd-m').textContent='Markiert. Jetzt kopieren oder abschreiben.';};
    try{navigator.clipboard.writeText(code).then(ok,fail);}catch(e){fail();}};
  $('#cd-x').onclick=close;
  if(ending)$('#cd-end').onclick=()=>{close();clearLocal();S=freshState();session.combo=0;session.cool=[0,0,0,0,0,0];go('start');};
}
function doorModal(i){
  const last=i===5;
  const close=modal(`<div class="door-scene"><div class="door-frame"><div class="door-panel"><span class="knob"></span></div></div></div>
    <p class="eyebrow" style="text-align:center">Schlüssel ${i+1} von 6</p>
    <h2 style="text-align:center">${last?'Der Weg zum Gipfel ist frei!':`Die Tür zu Etappe ${i+2} ist offen`}</h2>
    <p style="text-align:center">${last?'Jetzt kannst du Probearbeiten schreiben.':`Als Nächstes: ${LEVELS[i+1].title}.`} Du hast 100 Höhenmeter dazubekommen.</p>
    <div class="row-actions" style="justify-content:center"><button class="btn" id="dm-go">${last?'Zum Gipfel':'Weiter zu Etappe '+(i+2)}</button><button class="btn ghost" id="dm-x">Hier bleiben</button></div>`);
  $('#dm-go').onclick=()=>{close();go('level',i+1,'entdecken');};$('#dm-x').onclick=close;
}

window.addEventListener('beforeunload',save);
render();
}
